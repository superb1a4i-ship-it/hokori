<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的訂單｜日本扭蛋代購</title>
<style>
:root{--bg:#fbf6f1;--card:#fff;--ink:#2a2622;--sub:#7a7066;--line:#ece4da;--pink:#f7e3e6;--gold:#FFC93C;--green:#1F9D55;--red:#a32d2d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:0 0 env(safe-area-inset-bottom)}
header{background:#fff;border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 0}
h1{font-size:19px;margin:0}
.sub{color:var(--sub);font-size:13px}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:none;font-size:16px;padding:10px 0;border-bottom:3px solid transparent;color:var(--sub);font-weight:700}
.tabs button.on{color:var(--ink);border-bottom-color:#6b5443}
main{max-width:640px;margin:auto;padding:12px 12px 40px}
.sum{background:var(--pink);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.sum b{font-size:22px}
.order{background:#fff;border:2px solid #6b5443;border-radius:16px;padding:14px;margin-bottom:12px}
.order h3{margin:0 0 6px;font-size:17px}
.order .ln{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.order .ln span{flex:1}
.order .ln b{color:var(--red)}
.cp{border:1px solid #d9d1c7;background:#fbf6f1;border-radius:8px;padding:4px 10px;font-size:13px}
.go{display:block;text-align:center;background:#6b5443;color:#fff;border-radius:12px;padding:12px;font-weight:700;text-decoration:none;margin:10px 0 4px}
.note{font-size:13px;color:var(--sub)}
.together{border:3px solid var(--c);border-radius:18px;padding:8px 6px 0;margin-bottom:12px}
.together>.tg{font-size:14px;font-weight:700;color:var(--c);padding:0 8px 6px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.gh{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.gh .lab{font-weight:700;font-size:17px}
.gh .st{margin-left:auto;font-size:14px;font-weight:700;white-space:nowrap}
.money{padding:0 14px 10px;font-size:14px;color:var(--sub)}
.money .due{color:var(--red);font-weight:800;font-size:16px}
.money .ok{color:var(--green);font-weight:700}
.items{border-top:1px solid var(--line);display:none}
.grp.open .items{display:block}
.it{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid #f4eee7;align-items:center}
.it img,.it .nopic{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#f1ece5}
.it .nopic{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
.it .n{flex:1;min-width:0;font-size:15px}
.it .p{font-size:14px;color:var(--sub);white-space:nowrap;text-align:right}
.tag{font-size:12px;border-radius:999px;padding:1px 8px;margin-left:4px}
.tag.short{background:#fcebeb;color:var(--red)}.tag.hold{background:#fff1d6;color:#8a5a00}
details.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
details.box summary{font-weight:700;cursor:pointer}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.box input,.box textarea{width:100%;font-size:16px;padding:10px;border:1px solid #d9d1c7;border-radius:10px;margin:6px 0;font-family:inherit}
.box button.main,.main{width:100%;font-size:17px;padding:12px;border:0;border-radius:12px;background:#6b5443;color:#fff;font-weight:700}
.err{color:var(--red);font-weight:700;white-space:pre-wrap}
.big{position:fixed;inset:0;background:rgba(20,17,15,.92);display:none;align-items:center;justify-content:center;z-index:9}
.big img{max-width:96%;max-height:90%;border-radius:12px}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.wish{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.wish img{max-width:100%;max-height:260px;border-radius:12px;margin:6px 0;display:block}
.wish .who{font-size:13px;color:var(--sub)}
.wish .st{font-size:13px;font-weight:700;margin-left:6px}
.wish .acts{display:flex;gap:8px;margin-top:8px;align-items:center}
.wish .acts button{border:1px solid #d9d1c7;background:#fbf6f1;border-radius:999px;padding:6px 12px;font-size:14px}
.wish .acts button.on{background:#ffe7b3;border-color:#e0b04c}
.msgs{font-size:14px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.msgs div{margin:2px 0}
.say{display:flex;gap:6px;margin-top:6px}
.say input{flex:1;font-size:15px;padding:8px;border:1px solid #d9d1c7;border-radius:10px}
.say button{border:0;background:#6b5443;color:#fff;border-radius:10px;padding:0 12px}
</style>
</head>
<body>
<header><h1 id="hi">我的訂單</h1><div class="sub" id="at">讀取中…</div>
</header>
<main id="m"><div class="empty">讀取中…</div></main>
<div class="big" id="big"><img alt="商品大圖"></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
var API='https://script.google.com/macros/s/AKfycbygGbeKAk3etQFnk4Y6DoOULoOqVPF6q0Ct8mrrLlsaXZkvcOYFWjQP76Aqf2KIUC7mow/exec',LIFF='2012273722-4vfR8J73',SHOP='https:\/\/myship.7-11.com.tw\/cart\/easy\/GM2501160986854';
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+Number(n||0).toLocaleString()}
var idt='',asTest='',VIEW='o',D=null,W=null,START='o';
function call(fn,args){var b={fn:fn,args:args||[]};if(asTest){b.as=asTest;b.asName=asTest;b.k=localStorage.getItem('hokoriKey')||''}else b.idt=idt;
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(j){if(j.err)throw new Error(j.err);return j.r})}
function pic(id){return id?'https:\/\/drive.google.com\/thumbnail?id='+encodeURIComponent(id)+'&sz=w400':''}
function md(s){return s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):''}
function addDays(k,n){var d=new Date(k+'T12:00:00+09:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function todayS(){var d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10)}
function eta(g){
  if(g.st==='日本'){var d=new Date(Date.now()+9*3600e3),w=d.getUTCDay();d.setUTCDate(d.getUTCDate()+(w===0?0:7-w));var sd=(D&&D.ship)||d.toISOString().slice(0,10);return '預計 '+md(sd)+'（'+'日一二三四五六'[new Date(sd+'T12:00:00+09:00').getDay()]+'）送集運，送集運後約兩週內會通知下單'}
  if(g.st==='集運'&&/^\d{4}-\d{2}-\d{2}$/.test(g.k)){var d=addDays(g.k,14);return d>=todayS()?'預計 '+md(d)+' 那週通知下單':'快到囉，整理好就會通知下單'}
  if(g.st==='整理中')return '整理好就會通知下單';
  return ''}
function tab(v){VIEW=v;if(v==='w')return loadW();if(v==='f')return loadF();var ck='hokoriMe'+(asTest?'T':''),old=null;try{old=JSON.parse(localStorage.getItem(ck)||'null')}catch(e){}
  if(old&&old.bind==='已綁定'){D=old;rend(v,old);$('at').textContent='更新中…（先顯示上次看到的）'}else $('m').innerHTML='<div class="empty">讀取中…</div>';
  call('客_我的').then(function(d){D=d;try{localStorage.setItem(ck,JSON.stringify(d))}catch(e){}if(VIEW!==v)return;rend(v,d)}).catch(function(x){if(old&&old.bind==='已綁定')$('at').textContent='更新失敗，顯示的是上次的資料';else fail(x)})}
function grpHtml(g,i){
  var m='商品 '+money(g.rev);if(g.dep>0)m+='　已付訂金 '+money(g.dep);
  if(g.st==='待下單')m+=g.hold?'<br><span class="tag hold">🔗 已登記併單</span> 等下一批到再一起下單':'<br><span class="due">要下單 '+money(Math.max(0,g.rev-g.dep))+'</span>';
  else if(g.st==='等出貨')m+='<br><span class="ok">已下賣貨便</span>，'+(D&&D.wk2?D.wk2:'通常週五寄出，請留意簡訊')+'，到門市取貨付款';
  else if(g.st==='出貨')m+='<br><span class="ok">已寄出</span>';
  if(g.ship){var sp=g.ship,dd=sp.due?md(sp.due):'';
    if(sp.st==='已寄件')m+='<br>🚚 配送中';
    else if(sp.st==='已到店')m+='<br><span class="due">📍 已到 '+esc(sp.store||'門市')+(dd?'，請在 '+dd+' 前取貨':'')+'</span>';
    if(sp.st==='已寄件'||sp.st==='已到店')m+='<br><span class="note">⚠️ 包裹退回會收取退回處理費，請務必在期限內取貨</span>';
    else if(sp.st==='已取件')m+='<br><span class="ok">✅ 已取件，謝謝您</span>';
    else if(sp.st==='退回')m+='<br><span class="due">↩️ 包裹已退回，請跟我們聯絡</span>'}
  if(g.kuji&&g.st!=='出貨')m+='<br><span class="note">⚖️ 一番賞的國際運費還沒秤重，秤好才能下單</span>';
  var e=eta(g);if(e&&!g.hold)m+='<br>'+esc(e);
  return '<div class="grp'+(i<2&&g.st!=='出貨'?' open':'')+'"><div class="gh"><span class="lab">'+esc(g.lab)+'</span><span class="st">'+esc(g.t)+'</span></div><div class="money">'+m+'</div><div class="items">'+
    g.items.map(function(r){return '<div class="it">'+(r.pic?'<img loading="lazy" src="'+pic(r.pic)+'" data-big="'+esc(r.pic)+'" alt="">':'<div class="nopic">沒照片</div>')+
      '<div class="n">'+esc(r.n)+(r.short?'<span class="tag short">還在確認</span>':'')+(r.kuji?'<span class="tag hold">⚖️ 國際運費還沒秤重</span>':'')+'</div><div class="p">×'+r.q+'<br>'+money(r.sub)+'</div></div>'}).join('')+
    (g.fees||[]).map(function(f){return '<div class="it"><div class="nopic">費用</div><div class="n">'+esc(f.n)+'</div><div class="p">'+money(f.sub)+'</div></div>'}).join('')+'</div></div>'}
var COLORS=['#d9822b','#3b82c4','#8e5bc7','#2f9e6a','#c2477a'];
function show(d){
  $('at').textContent=d.at?('資料更新：'+md(d.at)+' '+d.at.slice(11)+'（每 15 分鐘更新一次）'):'';
  if(d.bind==='問是不是'){$('hi').textContent='我的訂單';
    $('m').innerHTML='<div class="box"><b>請問你是社群裡的「'+esc(d.guess)+'」嗎？</b><div class="sub">確認一次就好，以後打開就直接看到訂單</div><button class="main" id="yes" style="margin-top:10px">✅ 是我</button><button class="main" id="no" style="margin-top:8px;background:#e8e2da;color:#2a2622">不是我</button><div class="err" id="e"></div></div>';
    $('yes').onclick=function(){$('yes').disabled=true;call('客_是我').then(function(x){D=x;rend(VIEW,x)}).catch(function(x){$('e').textContent=x.message;$('yes').disabled=false})};
    $('no').onclick=function(){show({bind:'未綁定',name:d.name})};return}
  if(d.bind!=='已綁定'){$('hi').textContent='我的訂單';
    if(d.bind==='待確認'){$('m').innerHTML='<div class="box"><b>已經收到您的綁定資料囉！</b><br>小幫手確認後，您就能在這裡看到訂單（通常一天內）。現在還看不到是正常的喔 🙏</div>';return}
    $('m').innerHTML='<div class="box"><b>第一次使用，請告訴我們你是誰</b><div class="sub">請打你在「日本扭蛋代購」社群裡<b>完整的暱稱</b>，表情符號也要打進去（只要打一次）</div><input id="nk" placeholder="例：思婕🐈" maxlength="40"><button class="main" id="go">送出</button><div class="err" id="e"></div></div>';
    $('go').onclick=function(){var v=$('nk').value.trim();if(!v)return;$('go').disabled=true;call('客_申請',[v]).then(function(x){D=x;show(x)}).catch(function(x){$('e').textContent=x.message;$('go').disabled=false})};return}
  $('hi').textContent=(d.show||'')+' 的訂單';
  var gs=d.groups||[];
  var hist=gs.filter(function(g){return g.st==='出貨'&&(!g.ship||g.ship.st==='已取件')});
  var act=gs.filter(function(g){return hist.indexOf(g)<0});
  var pend=act.filter(function(g){return g.st==='待下單'&&!g.mb});
  var free=pend.filter(function(g){return !g.hold});
  var h='<div class="note" style="color:#8a4b2f;background:#fdf1e7;border-radius:8px;padding:8px 10px;margin:0 0 10px;line-height:1.6">還沒收到下單通知前，請不要為了保留免運券提早下單 🙏<br>因作業流程為整批產出條碼，無法另外挑出還沒到貨的商品，提早下單造成賣貨便條碼過期，無法負責請見諒</div>';
  if(free.length){var amt=pend.reduce(function(a,g){return a+g.rev-g.dep},0);var fill=amt<20?20:amt,back=amt<20?20-amt:0;
    h+='<div class="sum">🧾 這次要下單：<b>'+money(Math.max(amt,0))+'</b></div>';
    h+='<div class="order"><h3>🛒 這次要下的是：'+esc(pend.map(function(g){return g.lab}).join('、'))+'</h3>'+
      (d.wk?'<div class="note" style="margin:6px 0;color:#8a4b2f">📦 '+d.wk+'</div>':'')+'<div class="note" style="margin:6px 0">請照下面這個金額填寫就好 🙏（之後又有批次到台灣，再按一次「我要下單」，金額會自動更新）</div>'+
      (back?'<div class="note" style="color:#a32d2d">💌 賣貨便最低要填 $20，多付的 '+money(back)+' 我們會放在包裹裡退給您</div>':'')+
      '<a class="go" href="'+SHOP+'" target="_blank">🌱 打開自填單賣場</a><div class="note">照這樣填 👇（按「複製」再貼到賣貨便）</div>'+
      '<div class="ln"><span>📝 商品名稱：<b>'+esc(d.c)+'</b></span><button class="cp" data-cp="'+esc(d.c)+'">複製</button></div>'+
      '<div class="ln"><span>🔢 數量：<b>1</b></span><button class="cp" data-cp="1">複製</button></div>'+
      '<div class="ln"><span>💵 金額：<b>'+fill+'</b></span><button class="cp" data-cp="'+fill+'">複製</button></div>'+
      '<div class="note" style="margin-top:8px">要改宅配（運費 $80）請聯絡小幫手喔</div></div>';}
  else if(pend.length)h+='<div class="sum">🔗 您登記了併單，等下一批到了再一起下單 📦</div>';
  else h+='<div class="sum">目前沒有要下單的 🙌</div>';
  if(!act.length)h+='<div class="empty">目前沒有進行中的訂單 🙌</div>';
  var mbs={},ci=0;act.forEach(function(g){if(g.mb){mbs[g.mb]=(mbs[g.mb]||0)+1}});
  var done={};act.forEach(function(g,i){
    if(g.mb&&mbs[g.mb]>1){if(done[g.mb])return;done[g.mb]=1;var col=COLORS[ci++%COLORS.length];var same=act.filter(function(x){return x.mb===g.mb});
      h+='<div class="together" style="--c:'+col+'"><div class="tg">📦 併單寄出（'+esc(same.map(function(x){return x.lab}).join('＋'))+'）</div>'+same.map(function(x){return grpHtml(x,i)}).join('')+'</div>';return}
    h+=grpHtml(g,i)});

  if(hist.length)h+='<details class="box"><summary>📜 歷史訂單（已取件 '+hist.length+' 筆）</summary><div style="margin-top:8px">'+hist.map(function(g,i){return grpHtml(g,9)}).join('')+'</div></details>';
  $('m').innerHTML=h;}
/* 併下次：只列這個人可以併的批次＋併單規則 */
function showHold(d){if(d.bind!=='已綁定')return show(d);$('hi').textContent='🔗 併單';$('at').textContent='勾選要一起寄的批次';document.title='併單｜日本扭蛋代購';
  var c=(d.groups||[]).filter(function(g){return g.st!=='出貨'&&!g.mb&&!g.pre});var pre=(d.groups||[]).filter(function(g){return g.st!=='出貨'&&!g.mb&&g.pre});
  var h='<div class="box" style="font-size:15px"><b>📌 併單規則</b><div style="margin-top:6px">・最多併一次（累積兩批，寄出後歸零）<br>・併一次約多等 1～2 週<br>・要併的批次都還沒付訂金、而且這批 $300 以上，要先結清這批<br>・要併單的請先不要下單，等收到新通知再一起下單</div></div>';
  if(c.length<2){h+='<div class="empty">'+(c.length?'目前只有一批，沒有可以一起寄的批次，請直接下單喔 🙏':'目前沒有可以併的批次 🙌')+'</div>';$('m').innerHTML=h;return}
  var held=c.filter(function(g){return g.hold});
  if(held.length){var rest=c.filter(function(g){return !g.hold});h+='<div class="box"><b>✅ 已登記併單</b><div style="margin-top:8px;line-height:1.7">'+esc(held.map(function(g){return g.lab}).join('、'))+(rest.length?' ＋ '+esc(rest.map(function(g){return g.lab}).join('、')):'')+'<br>會等下一批到了再一起寄，到時候會通知您下單 📦</div><div class="note" style="margin-top:8px">要取消或改，請直接傳訊息給小幫手喔</div></div>';$('m').innerHTML=h;return}
  h+='<div class="box"><b>請勾要一起寄的兩批</b><div class="note" style="margin:4px 0 6px">例：勾「這批」＋「還在日本的那批」，就會等那批到了再一起寄</div>'+
    (held.length?'<div class="note" style="color:#8a5a00;margin-bottom:6px">已登記併單：'+esc(held.map(function(g){return g.lab}).join('、'))+'</div>':'')+
    (pre.length?'<div class="note" style="margin-bottom:6px">預購單不能併：'+esc(pre.map(function(g){return g.lab}).join('、'))+'</div>':'')+
    c.map(function(g){return '<label style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)"><input type="checkbox" class="hk" value="'+esc(g.k)+'"'+(g.hold?' checked':'')+' style="width:24px;height:24px;flex:none"><span style="flex:1"><b>'+esc(g.lab)+'</b>　'+esc(g.t)+'<br><span class="note">商品 '+money(g.rev)+(g.dep>0?'・已付訂金 '+money(g.dep):'・還沒付訂金')+'</span></span></label>'}).join('')+
    '<button class="main" id="hgo" style="margin-top:12px">送出併單</button><div class="err" id="he"></div></div>';
  $('m').innerHTML=h;}
function rend(v,d){v==='h'?showHold(d):v==='b'?showBind(d):show(d)}
/* 綁定帳號 */
function showBind(d){if(d.bind!=='已綁定'){show(d);$('hi').textContent='🔗 綁定帳號';return}
  $('hi').textContent='🔗 綁定帳號';$('at').textContent='';$('m').innerHTML='<div class="box"><b>✅ 已經綁定好囉</b><div style="margin-top:8px;line-height:1.7">社群暱稱：<b>'+esc(d.show||d.c)+'</b><br>按下面選單「📦 查我的訂單」就能看訂單、貨態；「🛒 我要下單」會告訴您這次要下多少。</div><div class="note" style="margin-top:8px">名字不對的話，請直接傳訊息給小幫手喔</div></div>'}
/* 購前須知／常見問題：一題一行，點開才看答案 */
function loadF(){$('hi').textContent='📢 購前須知／常見問題';document.title='購前須知／常見問題｜日本扭蛋代購';$('at').textContent='點題目看答案';$('m').innerHTML='<div class="empty">讀取中…</div>';
  call('客_常見問題').then(function(L){if(!L.length){$('m').innerHTML='<div class="empty">還沒有整理常見問題，請直接傳訊息問小幫手喔 🙏</div>';return}
    $('m').innerHTML=L.map(function(q,i){return '<details class="box"'+(i===0&&/購前須知/.test(q.t)?' open':'')+'><summary style="font-weight:600;font-size:16px;cursor:pointer">'+esc(q.t)+'</summary><div style="white-space:pre-wrap;margin-top:8px;line-height:1.7">'+esc(q.a)+'</div></details>'}).join('')+'<div class="note" style="text-align:center;margin:10px 0">找不到答案的話，直接傳訊息問小幫手喔 🙏</div>'}).catch(fail)}
/* 許願池 */
function loadW(){$('hi').textContent='🌟 許願池';document.title='許願池｜日本扭蛋代購';$('at').textContent='想找什麼都可以許願，大家都看得到';$('m').innerHTML='<div class="empty">讀取中…</div>';call('客_許願清單').then(function(w){W=w;showW()}).catch(fail)}
function showW(){var L=W.list||[];
  var h='<div class="box"><b>🌟 想找什麼？許個願吧！</b><div class="sub">大家都看得到，也可以按「我也想要」。小幫手會依大家想要的程度去找喔</div>'+
    '<textarea id="wt" rows="2" placeholder="想要什麼？例：吉伊卡哇 聖誕兔吊飾 粉色"></textarea><input id="wl" placeholder="有連結可以貼這裡（可不填）"><input id="wp" type="file" accept="image/*"><button class="main" id="wgo">許願 🌟</button><div class="err" id="we"></div></div>';
  if(!L.length)h+='<div class="empty">還沒有人許願，當第一個吧！</div>';
  h+=L.map(function(w){return '<div class="wish"><div class="who">'+esc(w.name)+'・'+md(w.at)+(w.st&&w.st!=='許願中'?'<span class="st">小幫手：'+esc(w.st)+'</span>':'')+'</div>'+
    (w.text?'<div style="white-space:pre-wrap;margin-top:4px">'+esc(w.text)+'</div>':'')+(w.link?'<div><a href="'+esc(w.link)+'" target="_blank">🔗 打開連結</a></div>':'')+
    (w.pic?'<img loading="lazy" src="'+pic(w.pic).replace('w400','w800')+'" data-big="'+esc(w.pic)+'" alt="">':'')+
    '<div class="acts"><button data-want="'+esc(w.id)+'" class="'+(w.me?'on':'')+'">🙋 我也想要（'+w.n+'）</button>'+(w.n?'<button data-who="'+esc(w.id)+'">看是誰</button>':'')+(w.mine?'<button data-wdel="'+esc(w.id)+'">刪掉</button>':'')+'</div>'+
    (w.msgs.length?'<div class="msgs">'+w.msgs.map(function(m){return '<div>'+(m.staff?'<b>🧡 小幫手</b>':esc(m.name))+'：'+esc(m.text)+'</div>'}).join('')+'</div>':'')+
    '<div class="say"><input data-say="'+esc(w.id)+'" placeholder="留言…" maxlength="200"><button data-send="'+esc(w.id)+'">送出</button></div></div>'}).join('');
  $('m').innerHTML=h;
  $('wgo').onclick=function(){var t=$('wt').value.trim(),l=$('wl').value.trim(),f=$('wp').files[0];if(!t&&!l&&!f){$('we').textContent='請寫想要什麼，或放照片、連結';return}
    $('wgo').disabled=true;$('we').textContent='';(f?shrink(f):Promise.resolve('')).then(function(b){return call('客_許願',[t,l,b])}).then(function(w){W=w;showW()}).catch(function(x){$('we').textContent=x.message;$('wgo').disabled=false})};}
function shrink(f){return new Promise(function(ok,bad){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.82))};im.onerror=function(){bad(new Error('照片讀不到'))};im.src=r.result};r.readAsDataURL(f)})}
document.addEventListener('click',function(e){var t=e.target;
  if(t.className==='hk'){var on=document.querySelectorAll('.hk:checked');if(on.length>2){t.checked=false;alert('最多只能勾兩批（併一次）')}return}
  if(t.id==='hgo'){var ks=[].map.call(document.querySelectorAll('.hk:checked'),function(x){return x.value});if(ks.length<2){$('he').textContent='請勾兩批：現在這批＋要一起寄的那批';return}
    t.disabled=true;call('客_併單',[ks]).then(function(r){alert(r.msg);D=r.me;showHold(D)}).catch(function(x){$('he').textContent=x.message;t.disabled=false});return}
  var cp=t.getAttribute&&t.getAttribute('data-cp');if(cp!=null){(navigator.clipboard?navigator.clipboard.writeText(cp):Promise.reject()).then(function(){t.textContent='已複製 ✓'}).catch(function(){prompt('長按複製：',cp)});return}
  var wa=t.getAttribute&&t.getAttribute('data-want');if(wa){t.disabled=true;call('客_想要',[wa]).then(function(w){W=w;showW()}).catch(function(x){alert(x.message);t.disabled=false});return}
  var wd=t.getAttribute&&t.getAttribute('data-wdel');if(wd){if(!confirm('刪掉這個願望？'))return;call('客_刪願',[wd]).then(function(w){W=w;showW()}).catch(function(x){alert(x.message)});return}
  var sd=t.getAttribute&&t.getAttribute('data-send');if(sd){var inp=document.querySelector('[data-say="'+sd+'"]');var v=inp.value.trim();if(!v)return;t.disabled=true;call('客_留言',[sd,v]).then(function(w){W=w;showW()}).catch(function(x){alert(x.message);t.disabled=false});return}
  var wh=t.getAttribute&&t.getAttribute('data-who');if(wh){var ww=(W.list||[]).find(function(x){return x.id===wh});if(ww)alert('🙋 想要的人：\n'+(ww.who||[]).join('、'));return}
  var gh=t.closest&&t.closest('.gh');if(gh){gh.parentNode.classList.toggle('open');return}
  var b=t.getAttribute&&t.getAttribute('data-big');if(b){$('big').querySelector('img').src=pic(b).replace('w400','w1200');$('big').style.display='flex';return}
  if(t.closest&&t.closest('#big'))$('big').style.display='none'});
function fail(x){$('m').innerHTML='<div class="box err">'+esc(x.message||x)+'</div>'}
(function(){var q=new URLSearchParams(location.search);asTest=q.get('as')||'';var pp=q.get('p');var start=pp==='wish'?'w':pp==='hold'?'h':pp==='faq'?'f':pp==='bind'?'b':'o';
  var go=function(){tab(start)};
  if(asTest){go();return}
  if(!window.liff||LIFF.indexOf('%')===0){fail('請從「日本扭蛋代購」官方賴下面的選單打開');return}
  try{var o0=JSON.parse(localStorage.getItem('hokoriMe')||'null');if(o0&&o0.bind==='已綁定'&&(start==='o'||start==='h')){D=o0;VIEW=start;start==='h'?showHold(o0):show(o0);$('at').textContent='更新中…（先顯示上次看到的）'}}catch(e){}
  liff.init({liffId:LIFF}).then(function(){if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}idt=liff.getIDToken();q=new URLSearchParams(location.search);pp=q.get('p');start=pp==='wish'?'w':pp==='hold'?'h':pp==='faq'?'f':pp==='bind'?'b':'o';go()}).catch(fail)})();
</script>
</body>
</html>
