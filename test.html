<link href="https://fonts.googleapis.com/css2?family=Iansui&family=Klee+One:wght@600&family=Zen+Kurenaido&family=Yomogi&family=Yusei+Magic&family=LXGW+WenKai+TC:wght@700&family=Huninn&family=Quicksand:wght@700&family=Chiron+GoRound+TC:wght@600&family=Nunito:wght@800&family=Noto+Serif+TC:wght@600&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:-apple-system,"PingFang TC","Hiragino Sans",sans-serif;color:#2a2622;background:#faf8f5;font-size:16px}
header{position:sticky;top:0;background:#faf8f5;border-bottom:1px solid #e8e2da;padding:10px 12px 8px;z-index:5}
h1{font-size:18px;margin:0 0 6px;font-weight:600}
.hint{font-size:13px;color:#7a7066;margin:6px 0 0}
.row{display:flex;gap:8px;align-items:end}
label{font-size:12px;color:#7a7066;display:block}
input,textarea{font-size:16px;width:100%;border:1px solid #d9d1c7;border-radius:8px;padding:6px 8px;background:#fff;font-family:inherit}
input{height:38px}
textarea{resize:none;line-height:1.3}
input.diff{background:#fff3d6}
input.manual{background:#eaf3de}
button{font-size:15px;height:42px;border-radius:10px;border:1px solid #6b5443;background:#fff;color:#6b5443;padding:0 12px;font-family:inherit}
button.main{background:#6b5443;color:#fff;border-color:#6b5443}
button.small{height:32px;font-size:13px;padding:0 10px}
.bar{display:flex;gap:8px;padding:10px 12px}
.bar button{flex:1}
.item{display:flex;gap:10px;padding:12px;border-bottom:1px solid #eee8e0;align-items:flex-start;background:#fff}
.item canvas{width:92px;height:auto;border-radius:6px;flex:none;align-self:flex-start;background:#eee}
.f{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.f .wide{grid-column:1/3}
.calc{font-size:13px;color:#7a7066}
.tier{display:none;grid-column:1/3;grid-template-columns:1fr 1fr;gap:6px}
.tier.open{display:grid}
.del{height:32px;padding:0 8px;border-color:#d9d1c7;color:#a32d2d;flex:none}
.empty{padding:40px 20px;text-align:center;color:#7a7066}
footer{padding:12px;display:flex;flex-direction:column;gap:8px}
#msg{font-size:15px;padding:0 12px 12px;white-space:pre-line}
#imgs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 20px}
#imgs div{aspect-ratio:3/4;background:#eee;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#imgs img{max-width:100%;max-height:100%}
#ed{position:fixed;inset:0;background:#1e1b18;z-index:20;display:none;flex-direction:column}
#ed.open{display:flex}
#edTop{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#fff}
#edTop .pills{display:flex;gap:6px}
#edTop .pills button{height:32px;font-size:13px;border-radius:999px;background:rgba(255,255,255,.92);color:#2a2622;border:none}
#edWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
#edCanvas{max-width:100%;max-height:100%;touch-action:none;border-radius:6px}
#edBot{display:flex;gap:8px;align-items:center;padding:10px 12px;color:#fff}
#edBot input[type=range]{flex:1;height:30px;padding:0;border:none;background:transparent}
#edBot button{height:40px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:30;padding:12px 12px 18px;transform:translateY(105%);transition:transform .2s ease-out;max-height:60vh;overflow:auto}
#sheet.open{transform:none}
#sheet h3{font-size:14px;margin:4px 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.opt{height:36px;font-size:14px;padding:0 12px;border-color:#d9d1c7;color:#2a2622}
.opt.on{border:2px solid #6b5443;color:#6b5443}
.sw{width:32px;height:32px;border-radius:50%;border:1px solid #bfb5aa;padding:0}
.sw.on{outline:2px solid #6b5443;outline-offset:2px}

#tabs{display:flex;position:sticky;top:0;z-index:8;background:#fff;border-bottom:1px solid #e8e2da}
#tabs button{flex:1;height:46px;border:none;border-radius:0;background:#fff;color:#7a7066;font-size:16px}
#tabs button.on{color:#6b5443;font-weight:600;box-shadow:inset 0 -3px 0 #6b5443}
#tabMake header{top:46px}
.pcard{background:#fff;border-bottom:8px solid #f1ece5;padding:12px}
.phead{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start}
.phead img,.phead .noimg{width:64px;height:84px;object-fit:cover;border-radius:6px;background:#eee;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#7a7066;text-align:center}
.pname{font-size:16px;font-weight:600}
.pmeta{font-size:13px;color:#7a7066}
.pcnt{font-size:15px;margin-top:4px}
.lack{color:#a32d2d;font-weight:600}.full{color:#3b6d11;font-weight:600}
.icons{display:flex;gap:6px;flex:1 1 100%;justify-content:flex-end;flex-wrap:wrap}
.icons button{height:36px;padding:0 10px;font-size:14px}
.line{display:flex;align-items:center;gap:6px;border-radius:8px;padding:6px 8px;margin-top:6px;font-size:15px}
.line .nm{flex:1;min-width:0}
.line2{border-radius:10px;padding:5px 8px;margin-top:4px}
.lph{flex:none;width:40px;min-width:40px;max-width:40px;height:40px;border-radius:8px;border:1px dashed #b9ada0;background:#fff;padding:0;font-size:20px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.lph img{width:100%;height:100%;object-fit:cover}
.lph.has{border-style:solid;border-color:#d9d1c7}
.pv{position:fixed;inset:0;background:rgba(20,17,15,.93);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.pv img{max-width:100%;max-height:70vh;border-radius:8px;background:#fff}
.pv .t{color:#fff;margin-top:10px;font-size:15px;text-align:center}
.pv .bt{display:flex;gap:8px;margin-top:14px;width:100%;max-width:420px}
.pv .bt button{flex:1;height:46px;border-radius:10px;border:none;font-size:15px}
.line2 .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.line2 .cn{font-size:15px;line-height:1.35;word-break:break-all}
.line2 .r2{display:flex;align-items:center;gap:6px;margin-top:3px}
.line2 button{height:32px;min-width:32px;padding:0 8px;border-color:rgba(0,0,0,.25);color:inherit;background:rgba(255,255,255,.6);font-size:15px}
.line2 .ic{border:none;background:transparent;padding:0 4px}
.line2 .wantb{border-style:dashed;border-color:currentColor;font-size:15px;padding:0 8px;height:36px}
.line2 .wantb .bn{font-size:21px;font-weight:700;min-width:0;margin:0 1px}
.line2 .gotn{font-size:24px;font-weight:700;min-width:26px}
.line2 b{min-width:20px;text-align:center;font-weight:600}
.line2 .lk{font-size:16px;font-weight:700;color:#a32d2d;min-width:44px;text-align:right}
.line2 .lk.ok{color:#3b6d11}
.line{gap:4px;padding:5px 6px}
.sp{font-size:12px;border:1px solid currentColor;border-radius:999px;padding:1px 8px;margin-left:4px;white-space:nowrap}
.dots{border:none!important;background:transparent!important;font-size:18px!important;padding:0 4px!important;min-width:24px!important}
.reorder .pcard{user-select:none;-webkit-user-select:none;padding:8px 12px;border-bottom-width:4px}
.reorder .pcard .line2,.reorder .pcard .icons,.reorder .pcard .addc,.reorder .pcard .pmeta,.reorder .pcard .pcnt,.reorder .pcard .mkp,.reorder .pcard .warn{display:none}
.reorder .phead img,.reorder .phead .noimg{width:44px;height:56px}
.reorder .phead{align-items:center;flex-wrap:nowrap}
.rbtns{display:none;gap:6px;align-items:center;flex:none}
.reorder .rbtns{display:flex}
.rbtns button{height:40px;padding:0 8px;font-size:13px;white-space:nowrap}
.hdl{touch-action:none;font-size:24px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px dashed #b9ada0;border-radius:8px;color:#6b5443;background:#fff;flex:none}
.pcard.drag{opacity:.95;box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;z-index:5;outline:2px solid #6b5443}
.mkb{flex:none;width:30px;min-width:30px;height:30px;padding:0;border-radius:8px;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.7);font-size:16px;margin-right:4px}
.mkp{display:flex;gap:10px;align-items:center;padding:8px 10px;margin-top:4px;background:#fff;border:1px solid #d9d1c7;border-radius:10px}
.mkp button{width:38px;height:38px;border-radius:50%;padding:0;border:2px solid rgba(0,0,0,.25);font-size:14px}
.tms{font-size:12px;opacity:.8;margin-top:3px;line-height:1.5}
.line2.ln{padding:6px 8px 6px 6px;border-radius:12px;margin-top:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}

function hsl(hex) {
    let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    let h = 0, s = 0, l = (mx + mn) / 2;
    if (mx !== mn) {
        const d = mx - mn;
        s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
        h *= 60;
    }
    return [ h, s * 100, l * 100 ];
}

function ink(hex) {
    const [h, s, l] = hsl(hex);
    return l > 55 ? `hsl(${Math.round(h)},${Math.round(Math.min(45, Math.max(15, s * .6)))}%,24%)` : `hsl(${Math.round(h)},${Math.round(Math.min(40, s))}%,93%)`;
}

function layout(ctx, it, W) {
    const st = it.st, f = fontOf(st.font), base = W * .04 * st.size;
    const nameLines = (it.name.value || "").replace(/\s+$/, "").split("\n").filter(x => x.trim() !== "");
    const price = (it.final.value || "").trim();
    const tierOn = it.tierBox.classList.contains("open") && it.tN.value && it.tP.value;
    const nf = `${f.w} ${Math.round(base * 1.05)}px "${f.cn}","Iansui",sans-serif`, pf = `${f.w} ${Math.round(base * 2.2 * f.nk)}px "${f.num}","Iansui",sans-serif`, cf = `${f.w} ${Math.round(base * 1.1 * f.nk)}px "${f.num}","Iansui",sans-serif`, tf = `${f.w} ${Math.round(base * .9)}px "${f.cn}","Iansui",sans-serif`;
    ctx.font = nf;
    const nW = Math.max(0, ...nameLines.map(t => ctx.measureText(t).width));
    const nH = nameLines.length * base * 1.4;
    ctx.font = cf;
    const cW = ctx.measureText("NT$").width;
    ctx.font = pf;
    const pW = ctx.measureText(price).width;
    const pH = base * 2.3 * f.nk;
    const tierTxt = tierOn ? "一次" + it.tN.value + "抽以上 每抽$" + it.tP.value : "";
    ctx.font = tf;
    const tW = tierTxt ? ctx.measureText(tierTxt).width : 0;
    const tH = tierTxt ? base * 1.3 : 0;
    const pad = base * .9, gap = base * .5;
    let w, h;
    if (st.shape === "A3" && nameLines.length) {
        const right = Math.max(cW + pW, tW);
        w = pad * 2 + nW + gap * 2 + right;
        h = pad * 1.4 + Math.max(nH, pH + tH);
    } else {
        w = pad * 2 + Math.max(nW, cW + pW, tW);
        h = pad * 1.4 + (nameLines.length ? nH + gap : 0) + pH + tH;
    }
    return {
        f: f,
        base: base,
        nameLines: nameLines,
        price: price,
        tierTxt: tierTxt,
        nf: nf,
        pf: pf,
        cf: cf,
        tf: tf,
        nW: nW,
        nH: nH,
        cW: cW,
        pW: pW,
        pH: pH,
        tW: tW,
        tH: tH,
        pad: pad,
        gap: gap,
        w: w,
        h: h
    };
}

function drawLabel(ctx, it, W, H) {
    if (!(it.final.value || "").trim()) return null;
    const L = layout(ctx, it, W), st = it.st, col = ink(st.bg);
    const m = Math.round(Math.min(W, H) * .03);
    const x = Math.min(W - L.w - m, Math.max(m, it.pos.x * W - L.w / 2)), y = Math.min(H - L.h - m, Math.max(m, it.pos.y * H - L.h / 2)), r = Math.min(L.h / 2, L.base * 1.8);
    ctx.save();
    if (st.shadow) {
        ctx.shadowColor = "rgba(0,0,0,.22)";
        ctx.shadowBlur = L.base * 1.1;
        ctx.shadowOffsetY = L.base * .35;
    }
    ctx.fillStyle = st.bg;
    ctx.beginPath();
    ctx.roundRect(x, y, L.w, L.h, r);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    ctx.textBaseline = "alphabetic";
    const priceRow = (px, py, align) => {
        ctx.font = L.cf;
        const tot = L.cW + L.pW;
        let sx = align === "c" ? px - tot / 2 : px;
        ctx.fillText("NT$", sx, py);
        ctx.font = L.pf;
        ctx.fillText(L.price, sx + L.cW, py);
    };
    if (st.shape === "A3" && L.nameLines.length) {
        ctx.font = L.nf;
        let ny = y + L.h / 2 - L.nH / 2 + L.base * 1.05;
        L.nameLines.forEach(t => {
            ctx.fillText(t, x + L.pad, ny);
            ny += L.base * 1.4;
        });
        const lx = x + L.pad + L.nW + L.gap;
        ctx.globalAlpha = .35;
        ctx.lineWidth = Math.max(1, L.base * .06);
        ctx.beginPath();
        ctx.moveTo(lx, y + L.pad * .6);
        ctx.lineTo(lx, y + L.h - L.pad * .6);
        ctx.stroke();
        ctx.globalAlpha = 1;
        const rx = lx + L.gap, blockH = L.pH + L.tH;
        let py = y + L.h / 2 - blockH / 2 + L.pH * .82;
        priceRow(rx, py, "l");
        if (L.tierTxt) {
            ctx.font = L.tf;
            ctx.fillText(L.tierTxt, rx, py + L.tH);
        }
    } else {
        ctx.textAlign = "left";
        const cx = x + L.w / 2;
        let cy = y + L.pad * .7;
        if (L.nameLines.length) {
            ctx.font = L.nf;
            L.nameLines.forEach(t => {
                const tw = ctx.measureText(t).width;
                cy += L.base * 1.4;
                ctx.fillText(t, cx - tw / 2, cy - L.base * .35);
            });
            ctx.globalAlpha = .3;
            ctx.lineWidth = Math.max(1, L.base * .06);
            ctx.beginPath();
            ctx.moveTo(x + L.pad, cy + L.gap * .3);
            ctx.lineTo(x + L.w - L.pad, cy + L.gap * .3);
            ctx.stroke();
            ctx.globalAlpha = 1;
            cy += L.gap;
        }
        cy += L.pH * .82;
        priceRow(cx, cy, "c");
        if (L.tierTxt) {
            ctx.font = L.tf;
            const tw = ctx.measureText(L.tierTxt).width;
            ctx.fillText(L.tierTxt, cx - tw / 2, cy + L.tH);
        }
    }
    ctx.restore();
    return {
        x: x,
        y: y,
        w: L.w,
        h: L.h
    };
}

function render(c, it) {
    const img = it.img;
    if (!img) return;
    const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
    c.width = Math.round(img.width * k);
    c.height = Math.round(img.height * k);
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return drawLabel(ctx, it, c.width, c.height);
}

const tried = new Set;

function needFonts(it) {
    const f = fontOf(it.st.font), txt = textOf(it), a = `${f.w} 40px "${f.cn}"`, b = `${f.w} 40px "${f.num}"`, key = a + b + txt;
    try {
        if (document.fonts.check(a, txt) && document.fonts.check(b, txt)) return null;
    } catch (e) {
        return null;
    }
    if (tried.has(key)) return null;
    tried.add(key);
    return Promise.all([ document.fonts.load(a, txt), document.fonts.load(b, txt), document.fonts.load('400 40px "Iansui"', txt) ]);
}

let ptrs = new Map, drag = null, pinch = null;

async function openEd(it) {
    if (!it.img) return;
    cur = it;
    $("ed").classList.add("open");
    $("edSize").value = Math.round(it.st.size * 100);

function toCanvas(e) {
    const r = edC.getBoundingClientRect();
    return {
        x: (e.clientX - r.left) * edC.width / r.width,
        y: (e.clientY - r.top) * edC.height / r.height
    };
}

edC.addEventListener("pointerdown", e => {
    if (!cur) return;
    edC.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, e);
    if (ptrs.size === 2) {
        const [a, b] = [ ...ptrs.values() ];
        pinch = {
            d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
            s: cur.st.size
        };
        drag = null;
        return;
    }
    const p = toCanvas(e), bx = cur.box;
    drag = {
        sx: p.x,
        sy: p.y,
        px: cur.pos.x,
        py: cur.pos.y,
        hit: bx && p.x >= bx.x && p.x <= bx.x + bx.w && p.y >= bx.y && p.y <= bx.y + bx.h
    };
    if (!drag.hit) {
        cur.pos = {
            x: p.x / edC.width,
            y: p.y / edC.height
        };
        drag = {
            sx: p.x,
            sy: p.y,
            px: cur.pos.x,
            py: cur.pos.y,
            hit: true
        };
        draw(cur);
    }
});

edC.addEventListener("pointermove", e => {
    if (!cur || !ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, e);
    if (pinch && ptrs.size === 2) {
        const [a, b] = [ ...ptrs.values() ];
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        cur.st.size = Math.max(.5, Math.min(2.5, pinch.s * d / pinch.d));
        $("edSize").value = Math.round(cur.st.size * 100);
        draw(cur);
        return;
    }
    if (drag && drag.hit) {
        const p = toCanvas(e);
        cur.pos = {
            x: drag.px + (p.x - drag.sx) / edC.width,
            y: drag.py + (p.y - drag.sy) / edC.height
        };
        draw(cur);
    }
});

[ "pointerup", "pointercancel" ].forEach(t => edC.addEventListener(t, e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (!ptrs.size) drag = null;
}));

}

function enqueue(fn, args) {

const BATCHABLE = [ "抽賞_改客人", "抽賞_勾套", "抽賞_賞設定", "採買_加客人", "採買_改數", "採買_刪客人", "採買_刪商品", "採買_改商品", "採買_排序", "採買_改扭日", "採買_標記", "採買_清行照" ];

function pump() {
    if (running || !ops.length) return;
    let n = 0;
    while (n < ops.length && n < 30 && BATCHABLE.includes(ops[n].fn)) n++;
    if (n >= 2) {
        running = true;
        const head = ops[0];
        google.script.run.withSuccessHandler(j => {
            let r = {};
            try {
                r = JSON.parse(j);
            } catch (er) {}
            if (r.v && /^\d+$/.test(r.v)) knownV = r.v;
            ops.splice(0, Math.min(n, r.done || 0));
            saveOps();
            running = false;
            if (r.err) {
                if (ops.length) ops[0].n = (ops[0].n || 0) + 1;
                failN++;
                saveOps();
                if (ops.length && ops[0].n >= 4) {
                    ops.shift();
                    saveOps();
                    failN = 0;
                    alert("有一筆存不進去（" + r.err + "），畫面會重新讀一次，請檢查（" + (window.__V || "") + "）");
                    load();
                    pump();
                    return;
                }
                syncTag();
                setTimeout(pump, 3e3);
                return;
            }
            failN = 0;
            syncTag();
            if (!ops.length) waiters.splice(0).forEach(f => f());
            pump();
        }).withFailureHandler(e => {
            running = false;
            head.n = (head.n || 0) + 1;
            failN++;
            saveOps();
            syncTag();
            setTimeout(pump, 3e3);
        }).採買_批次(JSON.stringify(ops.slice(0, n).map(o => ({
            fn: o.fn,
            args: o.args
        }))));
        return;
    }
    running = true;
    const op = ops[0];
    google.script.run.withSuccessHandler(v => {
        if (typeof v === "string" && /^\d+$/.test(v)) knownV = v;
        if (op.fn === "採買_設行照" && PHOTOFAIL.length) {
            let l = null;
            try {
                l = lineOf(op.args[0]);
            } catch (e) {}
            if (l) PHOTOFAIL = PHOTOFAIL.filter(x => x !== l.cust && x.indexOf(l.cust + "　") !== 0);
        }
        ops.shift();
        saveOps();
        running = false;
        failN = 0;
        syncTag();
        if (!ops.length) waiters.splice(0).forEach(f => f());
        pump();
    }).withFailureHandler(e => {
        running = false;
        op.n = (op.n || 0) + 1;
        failN++;
        saveOps();
        if (op.n >= 4) {
            ops.shift();
            saveOps();
            failN = 0;
            if (op.fn === "採買_設行照") {
                let l = null;
                try {
                    l = lineOf(op.args[0]);
                } catch (e) {}
                const who = l ? l.cust : "";
                PHOTOFAIL.push(who);
                showPhotoFail();
                alert("⚠ " + who + " 這一行的照片沒存到雲端（" + (e.message || e) + "）。\n請在那一行再拍／選一次照片。");
            } else alert("有一筆存不進去（" + (e.message || e) + "），畫面會重新讀一次，請檢查");
            load();
            pump();
            return;
        }
        syncTag();
        setTimeout(pump, 3e3);
    })[op.fn](...op.args);
}

function flush() {
    return new Promise(r => {
        if (!ops.length && !running) r(); else {
            waiters.push(r);
            pump();
        }
    });
}

        return `<div class="pcard" data-id="${p.id}"><div class="phead"><button data-pp="${p.id}" aria-label="商品照片（點了放大、可換）" style="padding:0;border:none;background:none;flex:none;height:auto;width:auto;border-radius:6px;cursor:pointer">${img}</button><div style="flex:1;min-width:0"><div class="pname">${p.name ? esc(p.name) : '<span class="unn">（還沒取名）</span>'}${p.blind ? ' <span class="sp" style="color:#534AB7">盲抽</span>' : ""}</div><div class="pmeta">日幣 ¥${p.jpy || 0}・${p.noPrice ? '<span class="nop">售價還沒填</span>' : `台幣 NT$${p.price}`}${tier}</div><div class="pcnt">要 ${want}・買到 ${got}・${want ? lack ? `<span class="lack">缺 ${lack}</span>` : '<span class="full">齊了</span>' : "還沒有客人"}</div></div><div class="rbtns"><button data-top="${p.id}">⬆ 最上</button><button data-bot="${p.id}">⬇ 最下</button><span class="hdl" aria-label="按住拖">☰</span></div><div class="icons"><button data-fd="${p.id}" aria-label="${FOLD[p.id] ? "展開" : "收起"}">${FOLD[p.id] ? "▸" : "▾"}</button><button data-all="${p.id}" aria-label="全部買到" style="width:auto;padding:0 8px;font-size:13px">✅全買到</button><button data-ep="${p.id}" aria-label="改商品">✏️</button><button data-ac="${p.id}" aria-label="加客人">＋👤</button><button data-cp="${p.id}" aria-label="複製清單">📋</button><button data-dp="${p.id}" aria-label="刪掉這個商品">🗑</button></div></div>${FOLD[p.id] ? "" : lines}${openAdd === p.id && !FOLD[p.id] ? addBox(p) : ""}</div>`;
    }).join("");
    $("logs").innerHTML = B.log.length ? B.log.map(x => `<div class="logrow">${esc(x.t.slice(5))}　${esc(x.cust)}　${esc(x.name)} ×${x.n}</div>`).join("") : '<div class="logrow" style="color:#7a7066">還沒有入單紀錄</div>';
    $("log7").textContent = logDays === 1 ? "看前 7 天" : "只看今天";
    const box = document.querySelector(".addc input.kw");
    if (box) {
        box.focus();
        box.oninput = () => renderSug(box.value);
        renderSug(box.value);
    }
}

function addBox(p) {
    return `<div class="addc"><div style="font-size:13px;color:#7a7066;margin-bottom:4px">加客人：打名字裡任何兩個字</div><div class="row"><input class="kw" placeholder="例：依哈" style="flex:1"><div style="width:122px"><label>要幾個</label><div style="display:flex;align-items:center;gap:4px"><button class="pm" data-qm="1" aria-label="少一個">－</button><b class="qtyv" style="min-width:24px;text-align:center;font-size:18px">1</b><button class="pm" data-qp="1" aria-label="多一個">＋</button></div></div></div><div style="font-size:12px;color:#7a7066;margin-top:4px">💡 同一位客人要追加：再加一次，會分成新的一行、入單也是分開的一列（不會合計）</div><div class="sug"></div><button class="small" data-x="1" style="margin-top:8px">取消</button></div>`;
}

function renderSug(kw) {
    const el = document.querySelector(".addc .sug");
    if (!el) return;
    const k = norm(kw);
    if (k.length < 1) {
        el.innerHTML = "";
        return;
    }
    const parts = [];
    for (let i = 0; i < k.length - 1; i++) parts.push(k.slice(i, i + 2));
    const exact = B.names.filter(n => norm(n).includes(k)).slice(0, 8);
    const score = n => {
        const nn = norm(n);
        let c = 0;
        for (const ch of new Set(k)) if (nn.includes(ch)) c++;
        return c / new Set(k).size;
    };
    const like = exact.length ? [] : B.names.map(n => [ n, score(n) ]).filter(x => x[1] >= .5).sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
    let h = exact.map(n => `<button data-pick="${esc(n)}">${esc(n)}</button>`).join("");
    if (!exact.length && like.length) h = '<div style="font-size:13px;color:#a32d2d;margin-top:6px">找不到完全一樣的，你是不是要：</div>' + like.map(n => `<button data-pick="${esc(n)}">${esc(n)}</button>`).join("");
    if (!B.names.some(n => norm(n) === k)) h += exact.length || like.length ? `<div style="margin-top:10px;font-size:12px;color:#7a7066">上面都不是？<button class="new small" data-new="${esc(kw.trim())}">＋ 這是新客人：${esc(kw.trim())}</button></div>` : `<div style="margin-top:6px"><button class="new" data-new="${esc(kw.trim())}">＋ 這是新客人：${esc(kw.trim())}</button></div>`;
    el.innerHTML = h;
}

const lineOf = id => B.products.flatMap(p => p.lines).find(l => l.id === id);

function actSheet(title, btns) {
    const d = document.createElement("div");
    d.className = "as";
    d.innerHTML = `<div class="in"><div class="t">${esc(title)}</div></div>`;
    btns.forEach(([t, fn, cls]) => {
        const b = document.createElement("button");
        b.textContent = t;
        if (cls) b.className = cls;
        if (!fn) b.className = "x";
        b.onclick = () => {
            d.remove();
            if (fn) fn();
        };
        d.querySelector(".in").appendChild(b);
    });
    d.onclick = e => {
        if (e.target === d) d.remove();
    };
    document.body.appendChild(d);
}

function fakeClick(k, v) {
    const b = document.createElement("button");
    b.dataset[k] = v;
    plistHandler({
        target: b
    });
}

function moveLine(p, l, w) {
    const a = p.lines, i = a.indexOf(l);
    if (i < 0) return;
    a.splice(i, 1);
    const j = w === "top" ? 0 : w === "up" ? Math.max(0, i - 1) : Math.min(a.length, i + 1);
    a.splice(j, 0, l);
    renderB();
    enqueue("採買_客人排序", [ p.id, JSON.stringify(a.map(x => x.id)) ]);
}

function lineMenu(l) {
    const p = B.products.find(x => x.lines.includes(l));
    if (!p) return;
    const i = p.lines.indexOf(l), n = p.lines.length, btns = [];
    if (i > 0) btns.push([ "⬆ 移到最上（優先給這位）", () => moveLine(p, l, "top") ], [ "↑ 上移一格", () => moveLine(p, l, "up") ]);
    if (i < n - 1) btns.push([ "↓ 下移一格", () => moveLine(p, l, "down") ]);
    btns.push([ "✎ 改要幾個", () => fakeClick("ew", l.id) ]);
    btns.push([ l.lp || l.lpLocal ? "📷 看／換這位客人的照片" : "📷 加這位客人的照片", () => fakeClick("lp", l.id) ]);
    if (p.blind) btns.push([ "✂ 設定拆幾個", () => fakeClick("sp", l.id) ]);
    btns.push([ "🗑 刪掉這位客人", () => fakeClick("dl", l.id), "del" ], [ "✕ 關閉", null ]);
    actSheet(l.cust + "　要 " + l.want + "・買到 " + l.got, btns);
}

function allText(ps) {
    return ps.map(p => {
        const got = p.lines.filter(l => l.got > 0), lack = p.lines.filter(l => l.want > l.got);
        if (!got.length && !lack.length) return "";
        return "【" + pNm(p) + "】\n" + (got.length ? "✅ 已買到：\n" + got.map(l => "・" + pubName(l.cust) + " ×" + l.got).join("\n") : "✅ 已買到：（還沒有）") + "\n" + (lack.length ? "⏳ 尚未買到：\n" + lack.map(l => "・" + pubName(l.cust) + " ×" + (l.want - l.got)).join("\n") : "⏳ 尚未買到：（都買齊了）");
    }).filter(Boolean).join("\n\n");
}

function copyMenu(ps, title) {
    actSheet(title, [ [ "📋 只複製還沒買到的", () => copyText(lackText(ps)) ], [ "📋 全部（已買到＋還沒買到，分開列）", () => copyText(allText(ps)) ], [ "✕ 關閉", null ] ]);
}

const plistHandler = async e => {
    if (reorder) {
        const rb = e.target.closest("button");
        if (!rb || !(rb.dataset.top || rb.dataset.bot)) return;
        const c = rb.closest(".pcard"), L = $("plist");
        if (rb.dataset.top) L.insertBefore(c, L.firstElementChild); else L.appendChild(c);
        c.scrollIntoView({
            block: "center"
        });
        c.classList.add("drag");
        setTimeout(() => c.classList.remove("drag"), 600);
        return;
    }
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    if (d.cm) {
        const l = lineOf(d.cm);
        if (l) lineMenu(l);
        return;
    }
    if (d.mk) {
        editMk = editMk === d.mk ? null : d.mk;
        renderB();
        return;
    }
    if (d.mkset !== undefined) {
        const l = lineOf(editMk);
        editMk = null;
        if (l) {
            l.mk = d.mkset;
            enqueue("採買_標記", [ l.id, d.mkset ]);
        }
        renderB();
        return;
    }
    if (d.fd) {
        if (FOLD[d.fd]) delete FOLD[d.fd]; else FOLD[d.fd] = 1;
        saveFold();
        renderB();
        return;
    }
    if (d.ac) {
        openAdd = d.ac;
        editWant = null;
        if (FOLD[d.ac]) {
            delete FOLD[d.ac];
            saveFold();
        }
        renderB();
        return;
    }
    if (d.x) {
        openAdd = null;
        editWant = null;
        editSplit = null;
        renderB();
        return;
    }
    if (d.sp) {
        editSplit = d.sp;
        editWant = null;
        openAdd = null;
        renderB();
        const i = document.querySelector(".addc .ns");
        if (i) {
            i.focus();
            i.select();
        }
        return;
    }
    if (d.spok) {
        const l = lineOf(d.spok);
        const v = Math.max(0, Math.min(l.want, parseInt(document.querySelector(".addc .ns").value) || 0));
        l.split = v;
        editSplit = null;
        renderB();
        enqueue("採買_改數", [ l.id, "split", v ]);
        return;
    }
    if (d.cp) {
        const p = B.products.find(x => x.id === d.cp);
        copyMenu([ p ], "複製「" + pNm(p) + "」");
        return;
    }
    if (d.ew) {
        editWant = d.ew;
        openAdd = null;
        renderB();
        return;
    }
    if (d.ewok) {
        const l = lineOf(d.ewok);
        const v = Math.max(1, parseInt(document.querySelector(".addc .nwv").textContent) || 1);
        const p = B.products.find(x => x.lines.includes(l));
        const was全 = l.split >= l.want;
        l.want = v;
        l.orig = v;
        editWant = null;
        if (p && p.blind) {
            const ns = was全 ? v : Math.min(l.split, v);
            if (ns !== l.split) {
                l.split = ns;
                enqueue("採買_改數", [ l.id, "split", ns ]);
            }
        }
        renderB();
        enqueue("採買_改數", [ l.id, "want", v ]);
        return;
    }
    if (d.pick || d.new !== undefined) {
        const q = Math.max(1, parseInt(document.querySelector(".addc .qtyv").textContent) || 1);
        const pid = openAdd;
        if (d.new !== undefined && !confirm("確定「" + d.new + "」是新客人？\n（以前買過的人請改用搜尋選，不然會變成兩個人）")) return;
        const cust = d.pick || d.new;
        const p = B.products.find(x => x.id === pid);
        const ex = p ? p.lines.find(x => x.cust === cust) : null;
        if (ex && confirm("「" + cust + "」在這個商品已經有 " + ex.want + " 個了。\n\n按「確定」＝合併成同一行，變 " + (ex.want + q) + " 個（建議）\n按「取消」＝另外再加一行 " + q + " 個")) {
            openAdd = null;
            const was全 = ex.split >= ex.want;
            ex.want += q;
            ex.orig = ex.want;
            if (p.blind && was全) {
                ex.split = ex.want;
                enqueue("採買_改數", [ ex.id, "split", ex.split ]);
            }
            renderB();
            enqueue("採買_改數", [ ex.id, "want", ex.want ]);
            return;
        }
        openAdd = null;
        if (!B.names.includes(cust)) B.names.push(cust);
        const l = {
            id: newId(),
            cust: cust,
            want: q,
            got: 0,
            orig: q,
            split: p.blind ? q : 0
        };
        p.lines.push(l);
        renderB();
        enqueue("採買_加客人", [ pid, cust, q, d.new !== undefined, l.id ]);
        return;
    }
    if (d.qm || d.qp) {
        const q = document.querySelector(".addc .qtyv");
        if (q) q.textContent = Math.max(1, (+q.textContent || 1) + (d.qp ? 1 : -1));
        return;
    }
    if (d.wm || d.wp) {
        const q = document.querySelector(".addc .nwv");
        if (q) q.textContent = Math.max(1, (+q.textContent || 1) + (d.wp ? 1 : -1));
        return;
    }
    if (d.p) {
        const l = lineOf(d.p);
        const T = TK(), tm = TM();
        l.got++;
        l.d = l.d || {};
        l.d[T] = (l.d[T] || 0) + 1;
        l.t = (l.t || []).concat([ tm ]);
        renderB();
        enqueue("採買_改數", [ l.id, "got", l.got, T, tm ]);
        return;
    }
    if (d.m) {
        const l = lineOf(d.m);
        if (l.got <= 0) return;
        l.got--;
        const m = l.d || {};
        const k = Object.keys(m).sort().pop();
        if (k) {
            m[k]--;
            if (m[k] <= 0) delete m[k];
        }
        if (l.t && l.t.length) l.t = l.t.slice(0, -1);
        renderB();
        enqueue("採買_改數", [ l.id, "got", l.got, TK() ]);
        return;
    }
    if (d.ed) {
        editDates(lineOf(d.ed));
        return;
    }
    if (d.lp) {
        const l = lineOf(d.lp);
        if (!l || l.lpBusy) return;
        const src = l.lpLocal || (l.lp ? `${PH(l.lp, 1000)}` : "");
        if (!src) {
            pickLinePhoto(l.id);
            return;
        }
        photoSheet(src, l.cust + " 的照片", [ [ "🔄 換一張", () => pickLinePhoto(l.id) ], [ "🗑 拿掉照片", () => {
            if (!confirm("拿掉 " + l.cust + " 這一行的照片？")) return;
            l.lp = "";
            l.lpLocal = "";
            renderB();
            enqueue("採買_清行照", [ l.id ]);
        } ], [ "✕ 關閉", null ] ]);
        return;
    }
    if (d.pp) {
        const p = B.products.find(x => x.id === d.pp);
        if (!p) return;
        const src = p.local || (p.photo && !p.home ? `${PH(p.photo, 1000)}` : "");
        const chg = () => pickPhoto(data => {
            p.local = data;
            p.home = false;
            p.photo = "";
            renderB();
            enqueue("採買_換商品照", [ p.id, data.split(",")[1], newId() ]);
        });
        if (!src) {
            chg();
            return;
        }
        photoSheet(src, pNm(p) + "（換照片只改這次，不改商品庫）", [ [ "🔄 換一張", chg ], [ "✕ 關閉", null ] ]);
        return;
    }
    if (d.all) {
        const p = B.products.find(x => x.id === d.all);
        if (!p) return;
        const ls = p.lines.filter(l => l.got < l.want);
        if (!ls.length) {
            alert("「" + pNm(p) + "」每位客人都已經買齊了");
            return;
        }
        const q = ls.reduce((a, l) => a + (l.want - l.got), 0);
        if (!confirm("把「" + pNm(p) + "」" + ls.length + " 位客人都設成買齊？\n（再加 " + q + " 個，全部共 " + p.lines.reduce((a, l) => a + l.want, 0) + " 個）\n\n真的有沒買到的，之後用 － 調回來")) return;
        const T = TK(), tm = TM();
        ls.forEach(l => {
            const add = l.want - l.got;
            if (isG(p)) {
                l.d = l.d || {};
                l.d[T] = (l.d[T] || 0) + add;
            }
            l.t = (l.t || []).concat(Array(add).fill(tm));
            l.got = l.want;
            enqueue("採買_改數", [ l.id, "got", l.got, T, tm ]);
        });
        renderB();
        return;
    }
    if (d.ep) {
        editProd(B.products.find(x => x.id === d.ep));
        return;
    }
    if (d.dl) {
        const l = lineOf(d.dl);
        if (!confirm("刪掉「" + l.cust + "」這一列？")) return;
        B.products.forEach(p => p.lines = p.lines.filter(x => x !== l));
        renderB();
        enqueue("採買_刪客人", [ l.id ]);
        return;
    }
    if (d.dp) {
        const p = B.products.find(x => x.id === d.dp);
        if (!confirm("刪掉商品「" + pNm(p) + "」和它下面所有客人？")) return;
        B.products = B.products.filter(x => x !== p);
        renderB();
        enqueue("採買_刪商品", [ p.id ]);
        return;
    }
};

        try {

            if (c && c.orders && !QD) {
                QD = c;
                qshow = 60;
                qrender();
            }

    }
    if (QD && !force) {
        if (qQuiet || Date.now() - qLast < 6e4) return;
        qQuiet = true;
        const tag = document.createElement("span");
        tag.textContent = "　🔄 背景更新中…";
        $("qcount").appendChild(tag);
        google.script.run.withSuccessHandler(async j => {
            qQuiet = false;
            qLast = Date.now();
            let raw0 = "";
            try {
                raw0 = await DB.get("QD") || "";
            } catch (e) {}
            try {
                DB.set("QD", j);

            const nq = JSON.parse(j);

            QD = nq;
            qrender();
            if (!same) bar("ok", "✓ 查訂單已更新成最新的");
        }).withFailureHandler(e => {
            qQuiet = false;
            tag.textContent = "　⚠ 更新失敗，按 🔄 再試（" + (window.__V || "") + "）";
        }).查訂單_讀取2();
        return;
    }
    $("qcount").textContent = "讀取總表中…";
    const j = await call("查訂單_讀取2");
    QD = JSON.parse(j);
    qLast = Date.now();
    try {
        DB.set("QD", j);
    } catch (e) {}
    qshow = 60;
    qrender();
}

const tagOf = (o, t) => ({
    "⏰ 要催": o.nag,
    "⚠ 國際運費未補": o.kuji,
    "📷 缺圖": o.nopic,
    "併單中": o.hold
}[t]);

function qpass(o) {
    for (const pair of QS) {
        const on = pair.filter(k => qst[k]);
        if (on.length === pair.length) continue;
        if (on.length && !on.some(k => has(o, k))) return false;
    }
    const tg = QT.filter(t => qtag[t]);
    if (tg.length && !tg.some(t => tagOf(o, t))) return false;
    if (qfrom || qto) {
        const d = new Date(o.mod);
        const ds = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        if (qfrom && ds < qfrom) return false;
        if (qto && ds > qto) return false;
    }
    const kw = norm($("qs").value);
    if (kw && !(norm(o.c).includes(kw) || o.rows.some(r => norm(r.n).includes(kw)))) return false;
    return true;
}

const money = n => "$" + Math.round(n).toLocaleString();

function qcard(o) {
    if (o.sent) return qcardSent(o);
    const lab = o.k === "未送集運" ? "🇯🇵 未入批" : o.pre ? "🟣 " + o.lab : "🚚 " + o.lab;
    const rows = o.rows.map(r => {
        const img = r.pic ? `<img loading="lazy" src="${PH(r.pic, 120)}" data-big="${esc(r.pic)}" data-bn="${esc(r.n)}" style="cursor:zoom-in" alt="">` : r.dep || r.acct ? '<div class="ni" style="color:#7a7066">' + (r.dep ? "訂金" : "帳") + "</div>" : '<div class="ni">沒照片</div>';
        const unit = r.dep ? "" : r.f ? `($${r.p}＋運$${r.f}) × ${r.q} ＝ ${money(r.sub)}` : `$${r.p} × ${r.q} ＝ ${money(r.sub)}`;
        return `<div class="oi">${img}<div class="t">${esc(r.n)}${r.dep ? "" : " ×" + r.q}${unit ? `<div class="u">${unit}</div>` : ""}${r.note ? `<div class="u">備註：${esc(r.note)}</div>` : ""}${r.rt ? `<div class="u" style="color:#8a5a00">↩ 上次${r.rt.sd ? " " + sdTxt(r.rt.sd) : ""}寄的那箱客人沒取、被退回，這次重寄：原本應付 ${money(r.rt.orig)}＋重寄費 ${money(r.rt.fee)}（重寄費＝運費＋包材＋人工，不賺錢）</div>` : ""}${r.kuji ? '<div class="u" style="color:#a32d2d">⚠ 國際運費未補</div>' : ""}</div><div class="s">${r.dep ? "−" + money(-r.sub) : money(r.sub)}</div></div>`;
    }).join("");
    const left = o.rev - o.dep;
    const m2 = !o.goods ? `<span style="color:#7a7066">只有訂金 ${money(o.dep)}（還沒有商品）</span>` : o.dep > 0 ? `訂金 <b>−${money(o.dep)}</b>　剩 <b style="color:#a32d2d">${money(left)}</b>` : '<span style="color:#a32d2d">💵 未收訂金</span>';
    const pl = (t, on, cls) => `<span class="pl ${on ? cls || "y" : ""}">${t}</span>`;
    const tags = [ o.nag ? pl("⏰ 要催", 1, "r") : "", o.kuji ? pl("⚠ 國際運費未補", 1, "r") : "", o.nopic ? pl("📷 缺圖", 1, "r") : "", o.hold ? pl("併單中", 1, "p") : "", o.pre ? pl("🟣 預購", 1, "p") : "" ].join("");
    return `<div class="oc${o.pre ? " pre" : ""}"><div class="oh"><div class="n">${esc(o.c)}</div><div class="b">${lab}</div></div>\n   <div class="om">收 <b style="color:#a32d2d">${money(o.rev)}</b>　本 <b>${money(o.cost)}</b>　潤 <b>${money(o.pro != null ? o.pro : o.rev - o.cost)}</b></div>${o.pk ? (o.pk.st === "先別包" ? `<div class="om" style="color:#c00000;font-weight:600">⛔ 先別包：${esc(o.pk.why.join("；"))}</div>` : `<div class="om" style="color:#555">${o.pk.st === "可以出貨" ? "✅ 阿姨已揀好，可以出貨" : (o.pk.st === "揀好等賣貨便" ? "🛍 阿姨已揀好，等客人下賣貨便" : "🧺 阿姨揀了 " + o.pk.got + "／" + o.pk.n + " 件")}${o.pk.chk ? "" : "（賣貨便金額沒記）"}</div>`) : ""}<div class="om">${m2}</div>\n   ${o.mb ? `<div class="om" style="color:#27500A">🏪 ${esc(o.mb)}</div>` : ""}${o.npd ? `<div class="om" style="color:#a32d2d">⚠ 這張有 ${o.npd} 樣還沒盤點</div>` : ""}${rows}\n   <div class="pills">${pl(o.ji ? "已送集運" : "未送集運", o.ji)}${pl(o.short ? "⚠缺" : o.pd ? "已盤點" : "未盤點", o.pd, o.short ? "r" : "y")}${pl(o.fh ? "已發貨" : "未發貨", o.fh)}${pl(o.mb ? "有賣貨便" : "沒賣貨便", !!o.mb)}${tags}</div>${qpkBtn(o)}</div>`;
}

const sdTxt = d => /^\d{4}-\d\d-\d\d$/.test(d || "") ? +d.slice(5, 7) + "/" + +d.slice(8, 10) : "（出貨日沒寫）";

function qrowsHtml(o) {

        const img = r.pic ? `<img loading="lazy" src="${PH(r.pic, 120)}" data-big="${esc(r.pic)}" data-bn="${esc(r.n)}" style="cursor:zoom-in" alt="">` : r.dep || r.acct ? '<div class="ni" style="color:#7a7066">' + (r.dep ? "訂金" : "帳") + "</div>" : '<div class="ni">沒照片</div>';
        const unit = r.dep ? "" : r.f ? `($${r.p}＋運$${r.f}) × ${r.q} ＝ ${money(r.sub)}` : `$${r.p} × ${r.q} ＝ ${money(r.sub)}`;
        return `<div class="oi">${img}<div class="t">${esc(r.n)}${r.dep ? "" : " ×" + r.q}${unit ? `<div class="u">${unit}</div>` : ""}${r.note ? `<div class="u">備註：${esc(r.note)}</div>` : ""}${r.rt ? `<div class="u" style="color:#8a5a00">↩ 上次${r.rt.sd ? " " + sdTxt(r.rt.sd) : ""}寄的那箱客人沒取、被退回，這次重寄：原本應付 ${money(r.rt.orig)}＋重寄費 ${money(r.rt.fee)}（重寄費＝運費＋包材＋人工，不賺錢）</div>` : ""}</div><div class="s">${r.dep ? "−" + money(-r.sub) : money(r.sub)}</div></div>`;

function qcardSent(o) {
    const paid = o.rev - o.dep;
    const pl = t => `<span class="pl">${t}</span>`;
    return `<div class="oc" style="background:#f1efec;border-color:#d8d2ca;opacity:.92"><div class="oh"><div class="n">${esc(o.c)}</div><div class="b" style="color:#5f5a54">✅ 已寄出 ${sdTxt(o.sd)}</div></div>

   <div class="om" style="color:#5f5a54">當時收 <b>${money(o.rev)}</b>${o.dep > 0 ? `　訂金 −${money(o.dep)}　實付 <b>${money(paid)}</b>` : ""}　本 ${money(o.cost)}　潤 ${money(o.pro != null ? o.pro : o.rev - o.cost)}</div>${o.pk && o.pk.st === "先別包" ? `<div class="om" style="color:#c00000;font-weight:600">⛔ 先別包：${esc(o.pk.why.join("；"))}</div>` : ""}${o.ret ? `<div class="om" style="color:#8a5a00;font-weight:600">↩ 這箱客人沒取、被退回了，改由${o.ret.rb ? " " + esc(o.ret.rb) + " 的" : ""}退回件重收 ${money(o.ret.amt)}（含重寄費 ${money(o.ret.fee)}）</div>` : ""}
   ${o.mb ? `<div class="om" style="color:#5f5a54">🏪 ${esc(o.mb)}</div>` : ""}${qrowsHtml(o)}
   <div class="pills">${pl("已寄出 " + sdTxt(o.sd))}</div>${qpkBtn(o)}</div>`;
}

const qkey = o => o.c + "\u0001" + o.k + "\u0001" + (o.sent ? "寄" + o.sd : "");

function qpkBtn(o) {

const smoney = x => x < 0 ? "−" + money(-x) : money(x);

const qTitle0 = o => /^\d{4}-\d\d-\d\d$/.test(o.k) ? "📦 " + o.k + " 批" : o.k === "未送集運" ? "🇯🇵 還在日本" : o.k.indexOf("預購") === 0 ? "🟣 " + o.k : "📦 " + o.lab;

const qTitle = o => o.sent ? "✅ 已寄出 " + sdTxt(o.sd) + (/^\d{4}-\d\d-\d\d$/.test(o.k) ? "（" + o.k + " 批）" : "") : qTitle0(o);

const qOrd = o => (/^\d{4}-\d\d-\d\d$/.test(o.k) ? "1" + o.k : o.k === "未送集運" ? "3" : "2" + o.k) + (o.sent ? "0" + (o.sd || "") : "1");

function detailText(list) {
    const byC = {}, names = [];
    list.forEach(o => {
        if (!byC[o.c]) {
            byC[o.c] = [];
            names.push(o.c);
        }
        byC[o.c].push(o);
    });
    return names.map(c => {
        const os = byC[c].slice().sort((a, b) => qOrd(a) < qOrd(b) ? -1 : qOrd(a) > qOrd(b) ? 1 : 0);
        const L = [ "【代購明細】" + c ];
        let tot = 0, totSent = 0;
        const nSent = os.filter(o => o.sent).length, nOpen = os.length - nSent;
        os.forEach(o => {
            L.push("");
            L.push(qTitle(o));
            if (o.sent && o.ret) L.push("　↩ 這箱沒取貨、被退回，改由退回件重收（見下面）");
            let st = 0;
            const grp = [];
            o.rows.forEach(r => {
                const kind = r.dep ? 2 : r.acct ? 1 : 0;
                const key = kind + "\u0001" + r.n + "\u0001" + r.p + "\u0001" + r.f + "\u0001" + (r.kuji ? 1 : 0);
                const g = kind === 2 ? null : grp.find(x => x.key === key);
                if (g) {
                    g.q += r.q;
                    g.sub += r.sub;
                } else grp.push(Object.assign({}, r, {
                    key: key,
                    kind: kind
                }));
            });
            grp.sort((a, b) => a.kind - b.kind);
            grp.forEach(r => {
                const sub = Math.round(r.sub);
                st += sub;
                if (r.dep) {
                    L.push("・已付訂金　" + smoney(sub));
                    return;
                }
                if (r.acct) {
                    L.push("・" + String(r.n).replace(/^金額調整｜/, "") + (r.q > 1 ? " ×" + r.q + "　" + smoney(r.p) + "×" + r.q + "＝" : "　") + smoney(sub));
                    return;
                }
                const unit = r.f ? "($" + r.p + "＋國運$" + r.f + ")" : "$" + r.p;
                L.push("・" + r.n + " ×" + r.q + "　" + unit + "×" + r.q + "＝" + smoney(sub) + (r.kuji ? "（國運未補）" : ""));
                if (r.rt) L.push("　（上次寄的那箱沒取貨被退回，這次重寄：原本應付 " + money(r.rt.orig) + "＋重寄費 " + money(r.rt.fee) + "）");
            });
            if (o.sent) {
                L.push("　這張小計 " + smoney(st) + "（已經寄出，不算在這次）");
                totSent += st;
                return;
            }
            if (os.length > 1) L.push("　這張小計 " + smoney(st));
            tot += st;
        });
        L.push("");
        if (!nOpen) {
            L.push("以上都是已經寄出的");
            return L.join("\n");
        }
        L.push((nSent ? "這次要付（不含已寄出的）" : "合計") + " " + smoney(tot));
        if (tot < 20) L.push("賣貨便請填 $20，包裹內會退 " + money(20 - tot));
        return L.join("\n");
    }).join("\n\n－－－－－－\n\n");
}

$("qpcopy").onclick = () => {
    const list = qpPicked();
    if (!list.length) return;
    const t = detailText(list);
    $("pop").dataset.soft = "";
    $("popIn").innerHTML = '<div id="cpH" style="font-weight:600;margin-bottom:6px">複製中…</div><textarea id="cpT" style="width:100%;height:44vh;font-size:15px;line-height:1.5"></textarea><div class="row" style="margin-top:10px"><button id="cpAgain" style="flex:1;min-height:44px">再複製一次</button><button class="main" id="popOk" style="flex:1;min-height:44px">好了</button></div>';
    $("cpT").value = t;
    $("pop").classList.add("open");
    $("popOk").onclick = () => $("pop").classList.remove("open");
    const ok = () => {
        $("cpH").innerHTML = '<span style="color:#3b6d11">✓ 已複製，可以直接貼到 LINE</span>（下面是內容，先看一眼數字對不對）';
    };
    const manual = () => {
        $("cpH").textContent = "手機不讓直接複製：請長按下面文字 → 全選 → 拷貝";
    };
    const tryCopy = () => {
        const a = $("cpT");
        let done = false;
        try {
            a.focus();
            a.select();
            a.setSelectionRange(0, a.value.length);
            done = document.execCommand("copy");
        } catch (e) {
            done = false;
        }
        try {
            a.blur();
        } catch (e) {}
        if (done) {
            ok();
            return;
        }
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, manual); else manual();
        } catch (e) {
            manual();
        }
    };
    $("cpAgain").onclick = tryCopy;
    tryCopy();
};

function qrender() {
    if (!QD) return;
    let L = QD.orders.filter(qpass);
    if (qsortBy === "mod") L.sort((a, b) => b.mod - a.mod); else if (qsortBy === "modAsc") L.sort((a, b) => a.mod - b.mod); else if (qsortBy === "name") L.sort((a, b) => a.c.localeCompare(b.c, "zh-Hant")); else if (qsortBy === "batch") L.sort((a, b) => b.k.localeCompare(a.k));
    $("qcount").textContent = "訂單數量：" + L.length + "　（" + QD.at + " 讀的，按 🔄 更新）";
    $("qlist").innerHTML = (L.length ? L.slice(0, qshow).map(qcard).join("") : '<div class="empty">沒有符合的訂單</div>');
    qCustCard(L);
    $("qmore").style.display = L.length > qshow ? "block" : "none";
    qpBar();
    $("qmore").textContent = "顯示更多（還有 " + (L.length - qshow) + " 張）";
    const on = QS.flat().filter(k => qst[k]);
    document.querySelector('[data-q="stat"]').textContent = "狀態" + (on.length ? "・" + on.join("、") : "");
    const tg = QT.filter(t => qtag[t]);
    document.querySelector('[data-q="tag"]').textContent = "標記" + (tg.length ? "・" + tg.length : "");
    document.querySelector('[data-q="date"]').textContent = qfrom || qto ? "日期・有設" : "日期";
}

let qCardC = "", qCardCache = {};

function qCustCard(L) {
    const kw = norm($("qs").value);
    const cs = [ ...new Set(L.map(o => o.c)) ];
    const c = kw && cs.length === 1 ? cs[0] : "";
    const old = $("qcustBox");
    if (old) old.remove();
    qCardC = c;
    if (!c) return;
    const box = document.createElement("div");
    box.id = "qcustBox";
    $("qlist").prepend(box);
    const show = card => {
        if (qCardC !== c || !$("qcustBox")) return;
        adCardsL = card ? [ card ] : [];
        $("qcustBox").innerHTML = card ? adCard(card, 0) : "";
    };
    if (qCardCache[c] !== undefined) return show(qCardCache[c]);
    box.innerHTML = '<div class="hint" style="padding:6px 12px">讀客人資料…</div>';
    google.script.run.withSuccessHandler(r => {
        qCardCache[c] = JSON.parse(r).find(x => x["客人"] === c) || null;
        show(qCardCache[c]);
    }).withFailureHandler(() => show(null)).後台_查客人(c);
}

let lpT = null, reorder = false, dragEl = null, dragY = 0, lastY = 0, scrollRAF = 0;

$("plist").addEventListener("pointerdown", e => {
    const c = e.target.closest(".pcard");
    if (!c) return;
    if (reorder) {
        const h = e.target.closest(".hdl");
        if (!h) return;
        e.preventDefault();
        dragEl = c;
        dragY = e.clientY;
        lastY = e.clientY;
        c.classList.add("drag");
        try {
            h.setPointerCapture(e.pointerId);
        } catch (er) {}
        cancelAnimationFrame(scrollRAF);
        scrollRAF = requestAnimationFrame(edgeScroll);
        return;
    }
    if (e.target.closest("button,input,.line2")) return;
    lpT = setTimeout(() => {
        startReorder();
    }, 600);
});

function endDrag() {
    cancelAnimationFrame(scrollRAF);
    if (dragEl) {
        dragEl.classList.remove("drag");
        dragEl.style.transform = "";
        dragEl = null;
    }
}

[ "pointerup", "pointercancel" ].forEach(t => $("plist").addEventListener(t, () => {
    clearTimeout(lpT);
    endDrag();
}));

$("plist").addEventListener("pointerleave", () => {
    clearTimeout(lpT);
});

function dragTo(y) {
    if (!dragEl) return;
    dragEl.style.transform = "translateY(" + (y - dragY) + "px)";
    for (let k = 0; k < 50; k++) {
        const dy = y - dragY;
        const prev = dragEl.previousElementSibling, next = dragEl.nextElementSibling;
        if (next && next.classList.contains("pcard") && dy > next.offsetHeight / 2) {
            next.after(dragEl);
            dragY += next.offsetHeight;
        } else if (prev && prev.classList.contains("pcard") && dy < -prev.offsetHeight / 2) {
            prev.before(dragEl);
            dragY -= prev.offsetHeight;
        } else break;
    }
    dragEl.style.transform = "translateY(" + (y - dragY) + "px)";
}

function edgeScroll() {
    if (!dragEl) return;
    const top = 150, bot = window.innerHeight - 90;
    let s = 0;
    if (lastY < top) s = -Math.min(24, 4 + (top - lastY) / 4); else if (lastY > bot) s = Math.min(24, 4 + (lastY - bot) / 4);
    if (s) {
        const before = window.scrollY;
        window.scrollBy(0, s);
        const moved = window.scrollY - before;
        if (moved) {
            dragY -= moved;
            dragTo(lastY);
        }
    }
    scrollRAF = requestAnimationFrame(edgeScroll);
}

$("plist").addEventListener("pointermove", e => {
    if (!dragEl) {
        if (lpT && Math.abs(e.movementY || 0) > 3) clearTimeout(lpT);
        return;
    }
    e.preventDefault();
    lastY = e.clientY;
    dragTo(e.clientY);
});

function drawSmall(src, w, h) {
    const c = document.createElement("canvas"), k = Math.min(1, 720 / Math.max(w, h));
    c.width = Math.max(1, Math.round(w * k));
    c.height = Math.max(1, Math.round(h * k));
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .75);
}

function readPhoto(f) {
    return new Promise((ok, ng) => {
        const viaImg = () => {
            const u = URL.createObjectURL(f), im = new Image;
            const t = setTimeout(() => ng(new Error("逾時")), 2e4);
            im.onload = () => {
                clearTimeout(t);
                try {
                    ok(drawSmall(im, im.naturalWidth || im.width, im.naturalHeight || im.height));
                } catch (e) {
                    ng(e);
                }
                URL.revokeObjectURL(u);
            };
            im.onerror = () => {
                clearTimeout(t);
                URL.revokeObjectURL(u);
                ng(new Error("讀不到"));
            };
            im.src = u;
        };
        if (window.createImageBitmap) {
            createImageBitmap(f).then(b => {
                try {
                    ok(drawSmall(b, b.width, b.height));
                } catch (e) {
                    viaImg();
                }
            }).catch(viaImg);
        } else viaImg();
    });
}

    };

const DB = {
    open() {
        return new Promise(r => {
            const q = indexedDB.open("hokoriWB", 1);
            q.onupgradeneeded = () => q.result.createObjectStore("kv");
            q.onsuccess = () => r(q.result);
            q.onerror = () => r(null);
        });
    },
    async set(k, v) {
        const d = await this.open();
        if (!d) return;
        d.transaction("kv", "readwrite").objectStore("kv").put(v, k);
    },
    async get(k) {
        const d = await this.open();
        if (!d) return null;
        return new Promise(r => {
            const q = d.transaction("kv").objectStore("kv").get(k);
            q.onsuccess = () => r(q.result);
            q.onerror = () => r(null);
        });
    }
};

let KJ = null, kjQuiet = false, kjPoll = null, kjOpen = {}, kjFold = {}, kjFocus = null;

const KJ_LET = s => {
    const a = [];
    s = s || {};
    if (s.kind === "N") {
        const n = parseInt(s.upto, 10) || 5;
        for (let i = 1; i <= n; i++) a.push(i + "等");
    } else {
        let end = String(s.upto || "I").charCodeAt(0);
        if (!(end >= 65 && end <= 90)) end = 73;
        for (let j = 65; j <= end; j++) a.push(String.fromCharCode(j));
    }
    String(s.extra || "").split(/[、,，\s]+/).forEach(x => {
        x = x.trim();
        if (!x || a.indexOf(x) >= 0) return;
        if (x === "特賞") a.unshift(x); else a.push(x);
    });
    return a;
};

const kjName = c => c.cust || c.nick || "（沒有名字）";

async function kjLoad(force) {
    if (!KJ) {
        try {
            const c = JSON.parse(await DB.get("KJ") || "null");
            if (c && c.sets && !KJ) {
                KJ = c;
                kjRender();
            }
        } catch (e) {}
    }
    if (KJ && !force) {
        kjRefresh();
        return;
    }
    $("kjMsg").textContent = "讀取中…";
    const j = await call("抽賞_讀取");
    KJ = JSON.parse(j);
    try {
        DB.set("KJ", j);
    } catch (e) {}
    kjRender();
}

function kjRefresh(then) {
    if (kjQuiet) return;
    kjQuiet = true;
    google.script.run.withSuccessHandler(j => {
        kjQuiet = false;
        if (ops.length || running) return;
        try {
            DB.set("KJ", j);
        } catch (e) {}
        KJ = JSON.parse(j);
        kjRender();
        if (then) then();
    }).withFailureHandler(() => {
        kjQuiet = false;
    }).抽賞_讀取();
}

function kjWaiting() {
    if (!KJ) return [];
    const w = KJ.sets.filter(s => (s.st === "等電腦" || s.st === "讀取中") && kjAgo(s.req) < 1800);
    if (KJ.list && (KJ.list.st === "等電腦" || KJ.list.st === "讀取中") && kjAgo(KJ.list.req) < 1800) w.push({
        id: "__清單__",
        req: KJ.list.req
    });
    return w;
}

function kjStartPoll() {
    clearInterval(kjPoll);
    kjPoll = setInterval(() => {
        if ($("tabKuji").style.display === "none") return;
        if (!kjWaiting().length) {
            clearInterval(kjPoll);
            kjPoll = null;
            return;
        }
        kjRefresh();
    }, 5e3);
}

function kjAgo(t) {
    if (!t) return 0;
    const d = new Date(t.replace(" ", "T") + "+09:00");
    return (Date.now() - d.getTime()) / 1e3;
}

function kjStText(s) {
    if (s.st === "等電腦") return kjAgo(s.req) > 120 ? '<span class="kjbad">⚠ 電腦沒有回應（可能沒開著、Claude 沒開）</span>' : '<span class="kjw">⏳ 等電腦讀…</span>';
    if (s.st === "讀取中") return kjAgo(s.req) > 900 ? '<span class="kjbad">⚠ 電腦讀太久，可能卡住了。先用原本的小幫手，晚點再按更新</span>' : '<span class="kjw">📖 電腦正在讀記事本…</span>';
    if (s.st === "失敗") return '<span class="kjbad">⚠ ' + esc(s.msg || "讀取失敗") + "</span>";
    if (s.last) return '<span class="kjg">上次更新 ' + esc(s.last.slice(5, 16)) + (s.msg ? "・" + esc(s.msg) : "") + "</span>";
    return '<span class="kjg">還沒讀過</span>';
}

function kjRender() {
    if (!KJ) return;
    const sets = KJ.sets.slice().sort((a, b) => (b.found || "") < (a.found || "") ? -1 : 1);
    const list = KJ.list;
    const listSt = list && (list.st === "等電腦" || list.st === "讀取中") ? ((list.st === "等電腦" && kjAgo(list.req) > 120) || kjAgo(list.req) > 900 ? '<span class="kjbad">⚠ 電腦沒有回應或卡住了，晚點再按</span>' : '<span class="kjw">⏳ 電腦正在找…</span>') : list && list.last ? '<span class="kjg">' + esc(list.last.slice(5, 16)) + " 找過" + (list.msg ? "・" + esc(list.msg) : "") + "</span>" : "";

    const foot = [];
    if (!on.length) h += '<div class="empty">勾上面這間店有的套，就會出現在這裡。</div>';
    on.forEach(s => {
        const cs = KJ.cust.filter(c => c.set === s.id);
        const wait = cs.filter(c => c.st === "待抽"), done = cs.filter(c => c.st === "已抽完"), cancel = cs.filter(c => c.st === "已取消");
        const L = KJ_LET(s.set);

        const sum = L.filter(k => cnt[k]).map(k => `<button class="kjs" data-kpz="${esc(k)}" data-kset="${esc(s.id)}">${esc(k)} <small>×${cnt[k]}</small></button>`).join("");
        const tot = wait.reduce((a, c) => a + (c.cnt || 0), 0);
        h += `<div class="kjcard"><div class="kjch"><div style="flex:1;min-width:0"><div class="kjct">${esc(s.title)}</div><div class="kjsub">${wait.length} 位・共 ${tot} 抽　${kjStText(s)}</div></div><button class="main small" data-kup="${esc(s.id)}" style="height:40px">🔄 更新</button><button class="small" data-kcfg="${esc(s.id)}" style="height:40px" aria-label="賞的設定">⚙</button></div>`;
        if (kjOpen["cfg" + s.id]) h += `<div class="addc"><div class="row" style="align-items:center;flex-wrap:wrap"><select data-kkind="${esc(s.id)}"><option value="L" ${s.set.kind !== "N" ? "selected" : ""}>英文（A賞…）</option><option value="N" ${s.set.kind === "N" ? "selected" : ""}>數字（1等…）</option></select> 到 <select data-kupto="${esc(s.id)}">${s.set.kind === "N" ? Array.from({
            length: 15
        }, (_, i) => `<option value="${i + 1}" ${String(i + 1) === String(s.set.upto) ? "selected" : ""}>${i + 1} 等</option>`).join("") : Array.from({
            length: 25
        }, (_, i) => String.fromCharCode(66 + i)).map(x => `<option value="${x}" ${x === s.set.upto ? "selected" : ""}>${x} 賞</option>`).join("")}</select></div><input data-kextra="${esc(s.id)}" value="${esc(s.set.extra || "")}" placeholder="另外的賞（例：特賞、SP、W，用頓號隔開）" style="margin-top:6px"></div>`;
        if (sum) foot.push({
            t: s.title.replace(/^\s*\d+\/\d+\s*(（.）)?\s*/, ""),

        });
        h += wait.length ? wait.map((c, i) => kjCust(c, i, L)).join("") : '<div class="hint" style="padding:8px 2px">這套目前沒有待抽的客人</div>';
        h += `<div class="row" style="margin-top:8px"><button class="small" data-kadd="${esc(s.id)}" style="flex:1">＋ 手動加客人（選順序圖）</button><button class="small" data-kaddn="${esc(s.id)}" style="flex:1">＋ 不選賞的客人</button></div>`;

function kjPrize(setId, k) {
    const wait = KJ.cust.filter(c => c.set === setId && c.st === "待抽");

    wait.forEach((c, i) => {

        h += `<div class="kjwho"><div class="kjwt">${i + 1}. ${esc(kjName(c))}（${c.cnt || "?"}抽）<b>${esc(k)} ×${m}</b></div>${c.note ? `<div class="kjmemo">📝 ${esc(c.note)}</div>` : ""}${c.img ? `<img src="${PH(c.img, 1200)}" alt="順序圖">` : '<div class="kjfree">不選賞，隨便給</div>'}</div>`;

function kjPickName(c) {

$("kjList").addEventListener("click", e => {
    const b = e.target.closest("button,img,input");
    if (!b) return;
    const d = b.dataset;
    if (d.kon !== undefined) {
        const s = KJ.sets.find(x => x.id === d.kon);
        s.on = b.checked;
        kjRender();
        enqueue("抽賞_勾套", [ s.id, s.on ]);
        return;
    }
    if (d.kfind) {
        KJ.list = Object.assign(KJ.list || {}, {
            st: "等電腦",
            req: new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 19).replace("T", " ")
        });
        kjRender();
        call("抽賞_請求更新", "__清單__").then(() => kjRefresh(kjStartPoll));
        return;
    }
    if (d.kold) {
        const kw = (window.prompt("要找哪一套？打標題裡的幾個字（例：PINGU、寶可夢）", "") || "").trim();
        if (!kw) return;
        KJ.list = Object.assign(KJ.list || {}, {
            st: "等電腦",
            req: new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 19).replace("T", " ")
        });
        kjRender();
        call("抽賞_請求更新", "__清單__", kw).then(() => kjRefresh(kjStartPoll));
        return;
    }
    if (d.kall) {
        kjFold.__all = 1;
        kjRender();
        return;
    }
    if (d.kup) {
        const s = KJ.sets.find(x => x.id === d.kup);
        s.st = "等電腦";
        s.req = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 19).replace("T", " ");
        kjRender();
        call("抽賞_請求更新", s.id).then(() => kjRefresh(kjStartPoll));
        return;
    }
    if (d.kcfg) {
        kjOpen["cfg" + d.kcfg] = !kjOpen["cfg" + d.kcfg];
        kjRender();
        return;
    }
    if (d.kpz) {
        kjPrize(d.kset, d.kpz);
        return;
    }
    if (d.kadd || d.kaddn) {
        kjAddManual(d.kadd || d.kaddn, !!d.kadd);
        return;
    }
    if (d.kback) {
        kjSave(kjC(d.kback), {
            st: "待抽"
        });
        return;
    }
    const c = kjC(d.kk ? d.kc : d.krm || d.kundo || d.kcm || d.kcp || d.kdone || d.kmore || d.kname || d.kz || "");
    if (!c) return;
    if (d.kk) {
        kjSave(c, {
            picks: c.picks.concat([ d.kk ]),
            nu: false
        });
        return;
    }
    if (d.krm) {
        const p = c.picks.slice();
        p.splice(+d.ki, 1);
        kjSave(c, {
            picks: p
        });
        return;
    }
    if (d.kundo) {
        kjSave(c, {
            picks: c.picks.slice(0, -1)
        });
        return;
    }
    if (d.kcm || d.kcp) {
        const v = Math.max(0, (c.cnt || 0) + (d.kcp ? 1 : -1));
        kjSave(c, {
            cnt: v || ""
        });
        return;
    }
    if (d.kdone) {
        kjSave(c, {
            st: "已抽完",
            nu: false
        });
        return;
    }
    if (d.kname) {
        kjPickName(c);
        return;
    }
    if (d.kz) {
        bigImg(c.img, kjName(c));
        return;
    }
    if (d.kmore) {
        actSheet(kjName(c) + "　" + (c.cnt || "?") + " 抽", [ [ "✎ 改備註", () => {
            const t = window.prompt("備註（例：有娃娃吊飾才抽）", c.note || "");
            if (t !== null) kjSave(c, {
                note: t
            });
        } ], [ "👤 改成哪位客人", () => kjPickName(c) ], [ "🗑 取消（客人不要了）", () => {
            if (confirm("確定取消 " + kjName(c) + " 嗎？\n（會收進「已取消」，按錯可以拿回來）")) kjSave(c, {
                st: "已取消",
                nu: false
            });
        }, "del" ], [ "✕ 關閉", null ] ]);
        return;
    }
});

let PMIQ = 0;
function pmImgLoad() {
    const L = [ ...document.querySelectorAll("img[data-pmimg]") ].filter(im => !im.dataset.go);
    const next = () => {
        const im = L.shift();
        if (!im) return;
        const id = im.dataset.pmimg;
        im.dataset.go = "1";
        if (PMIMG[id]) {
            im.src = PMIMG[id];
            return next();
        }
        PMIQ++;
        call("後台_私訊圖", id, false).then(u => {
            PMIMG[id] = u;
            document.querySelectorAll('img[data-pmimg="' + id + '"]').forEach(x => x.src = u);
        }).catch(() => {
            im.replaceWith(document.createTextNode("📎 照片讀不到"));
        }).finally(() => {
            PMIQ--;
            next();
        });
    };
    for (let i = 0; i < 4; i++) next();
}

        const x = adList[+d.adv];
        x.vip = !x.vip;
        if (adMode === "定金" && x.vip) x.on = false;
        adRows();
        google.script.run.withFailureHandler(er => alert("VIP 沒存到：" + (er.message || er))).後台_VIP(x.c, x.vip);
        return;
    }
    if (t.id === "adSend") {
        const tpl = $("adTpl").value;
        adTpl[adMode] = tpl;
        const sel = adList.filter(x => x.on && x.line);
        if (!sel.length || !confirm("確定用官方賴傳給 " + sel.length + " 位嗎？\n\n範例：\n" + adPrev(sel[0]))) return;
        t.disabled = true;
        call("後台_發送", adMode, adKey, JSON.stringify(sel.map(x => ({ c: x.c, amt: x.amt }))), tpl).then(r => {
            JSON.parse(r).forEach(x => adRes[x.c] = x.r);
            adList.forEach(x => {
                if (adRes[x.c] === "已傳") x.on = false;
            });
            adRows();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.adok != null && d.adc2 != null) {
        call("後台_綁定確認", d.adok, d.adc2).then(r => {
            adBindRender(JSON.parse(r));
            google.script.run.withSuccessHandler(x => {
                AD = JSON.parse(x);
            }).後台_總覽();
        });
        return;
    }
    if (d.pmv) {
        PMV = d.pmv;
        return adPm();
    }
    if (d.upc) {
        UP[+d.upc].on = t.checked;
        adUnpaidRender();
        return;
    }
    if (t.id === "upSend") {
        const sel = UP.filter(x => x.on);
        if (!sel.length || !confirm("確定再提醒這 " + sel.length + " 位匯款嗎？")) return;
        t.disabled = true;
        call("後台_再提醒", JSON.stringify(sel.map(x => ({ c: x.c, k: x.k, amt: x.amt, n: x.n, first: x.first })))).then(r => {
            const m = {};
            JSON.parse(r).forEach(y => m[y.c] = y.r);
            UP.forEach(x => {
                if (m[x.c]) {
                    x.r = m[x.c];
                    x.on = false;
                    if (m[x.c] === "已傳") x.n++;
                }
            });
            adUnpaidRender();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.wsort) {
        WSort = d.wsort;
        return adWish();
    }
    if (d.wsay) {
        const v = document.querySelector('[data-wre="' + CSS.escape(d.wsay) + '"]').value.trim();
        if (!v) {
            alert("請先打留言");
            return;
        }
        call("後台_許願回", d.wsay, v).then(() => adWish());
        return;
    }
    if (d.wdel) {
        if (!confirm("確定刪掉這個願望？")) return;
        call("後台_許願刪", d.wdel).then(() => {
            WS = WS.filter(w => w.id !== d.wdel);
            adWishRender();
        });
        return;
    }
    if (d.fqs != null) {
        const r = d.fqs, k = document.querySelector('[data-fqk="' + r + '"]').value.trim(), a = document.querySelector('[data-fqa="' + r + '"]').value.trim();
        if (!k || !a) {
            alert("關鍵字和答案都要填");
            return;
        }
        call("後台_常見問題存", r, k, a, true).then(x => {
            FQ = JSON.parse(x);
            pmFaqRender();
        });
        return;
    }
    if (d.fqd) {
        if (!confirm("刪掉這題？")) return;
        call("後台_常見問題刪", d.fqd).then(x => {
            FQ = JSON.parse(x);
            pmFaqRender();
        });
        return;
    }
    if (d.pmall) {
        const q = (s, r) => document.querySelector("[" + s + '="' + r + '"]').value.trim();
        const L = PMH.filter(x => x.st === "待核對").map(x => ({ row: x.row, c: q("data-pmc", x.row), k: q("data-pmk", x.row), amt: q("data-pma", x.row) }));
        if (!confirm("把這 " + L.length + " 筆全部入帳？（沒填客人或金額的會跳過）")) return;
        t.disabled = true;
        call("後台_匯款全部入帳", JSON.stringify(L)).then(r => {
            const o = JSON.parse(r);
            alert("✅ 入帳 " + o.ok.length + " 筆" + (o.ok.length ? "：\n" + o.ok.join("\n") : "") + (o.skip.length ? "\n\n⚠ 跳過 " + o.skip.length + " 筆：\n" + o.skip.join("\n") : ""));
            adPm();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.pmchat) {
        const u = prompt("在電腦打開官方賴跟這位客人的聊天室，把最上面的網址整段複製，貼在這裡：");
        if (!u) return;
        t.disabled = true;
        call("後台_聊天室補", d.pmchat, u.trim()).then(r => {
            PM.list.forEach(y => {
                if ((y.c || y.name || "?") === d.pmchat) y.chat = r;
            });
            delete PMC["要回"];
            adPmRender();
        }).catch(er => {
            t.disabled = false;
            alert("沒存到：" + (er.message || er));
        });
        return;
    }
    if (d.pmdone) {
        if (d.pmall2 && !confirm("確定全部都處理好了？")) return;
        t.disabled = true;
        call("後台_私訊處理", d.pmdone).then(() => {
            const done = String(d.pmdone).split(",");
            PM.list = PM.list.filter(y => done.indexOf(String(y.row)) < 0);
            if (PM.cnt) PM.cnt["要回"] = Math.max(0, (PM.cnt["要回"] || 0) - done.length);
            delete PMC["全部"];
            adPmRender();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.pmbank) {
        const v = $("pmBank").value.trim();
        if (!v) {
            alert("請先貼上匯款資訊");
            return;
        }
        call("後台_匯款資訊", v).then(r => {
            t.textContent = "✅ " + r;
            PM.bank = true;
        });
        return;
    }
    if (d.pmin) {
        const q = s => document.querySelector("[" + s + '="' + d.pmin + '"]').value.trim();
        const c = q("data-pmc"), k = q("data-pmk"), a = q("data-pma");
        if (!c || !(+a > 0)) {
            alert("請確認客人和金額");
            return;
        }
        if (!confirm("把 " + c + " 的訂金 $" + a + (k ? "（" + k + " 批）" : "") + " 寫進總表？")) return;
        t.disabled = true;
        call("後台_匯款入帳", d.pmin, c, a, k).then(r => {
            t.textContent = "✅ 入帳了";
            alert(r);
            PMH = PMH.filter(y => String(y.row) !== String(d.pmin));
            if (PM.cnt) PM.cnt["匯款"] = Math.max(0, (PM.cnt["匯款"] || 1) - 1);
            adPmRender();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.pmnot) {
        if (!confirm("確定這則不是匯款？")) return;
        call("後台_匯款不是", d.pmnot).then(() => {
            PMH = PMH.filter(y => String(y.row) !== String(d.pmnot));
            adPmRender();
        });
        return;
    }
    if (d.pmm) {
        call("後台_私訊模式", d.pmm).then(() => adPm());
        return;
    }
    if (d.pmr) return adPm(true);
    if (d.pmok || d.pmno) {
        const row = d.pmok || d.pmno, note = document.querySelector('[data-pmn="' + row + '"]').value.trim();
        if (d.pmno && !note) {
            alert("請先在旁邊打要怎麼改");
            return;
        }
        call("後台_私訊評", row, d.pmok ? "好" : "要改", note).then(() => {
            const x = PM.list.find(y => String(y.row) === String(row));
            if (x) {
                x.ok = d.pmok ? "好" : "要改";
                x.note = note;
            }
            t.textContent = "✅ 記下了";
        });
        return;
    }
    if (d.adsave) {
        const i = +d.adsave, c = adCardsL[i], q = s => document.querySelector("[" + s + '="' + i + '"]').value.trim();
        call("後台_資料卡補充", c["客人"], q("data-adn"), q("data-adp"), q("data-adm2")).then(() => {
            c["真實姓名"] = q("data-adn");
            c["電話"] = q("data-adp");
            c["備註"] = q("data-adm2");
            t.textContent = "✅ 存好了";
        });
        return;
    }
    if (d.adnew) {
        const v = document.querySelector('[data-adin="' + CSS.escape(d.adnew) + '"]').value.trim();
        if (!v) {
            alert("請先在旁邊打這位新客人在總表要用的名字（例：賴名字（社群暱稱）");
            return;
        }
        if (!confirm("把「" + v + "」加進客人清單當新客人，並綁定這個賴？")) return;
        call("後台_綁定確認", d.adnew, v, true).then(r => adBindRender(JSON.parse(r)));
        return;
    }
    if (d.adtype) {
        const v = document.querySelector('[data-adin="' + CSS.escape(d.adtype) + '"]').value.trim();
        if (!v) return;
        call("後台_綁定確認", d.adtype, v).then(r => adBindRender(JSON.parse(r)));
    }
});

$("tabAdmin").addEventListener("change", e => {
    const d = e.target.dataset;
    if (d.wst) {
        call("後台_許願狀態", d.wst, e.target.value).then(() => {
            const w = WS.find(y => y.id === d.wst);
            if (w) w.st = e.target.value;
        });
        return;
    }
    if (d.adc) {
        adList[+d.adc].on = e.target.checked;
        adRows();
    }
    if (d.ada) {
        adList[+d.ada].amt = Math.max(0, Math.round(+e.target.value || 0));
        adRows();
    }
    if (e.target.id === "adKey") {
        adKey = e.target.value;
        adList = [];
        $("adRows").innerHTML = "";
    }
});

$("tabAdmin").addEventListener("input", e => {
    if (e.target.id === "adQ") {
        adQ = e.target.value;
        if ($("adRows") && adList.length) adRows();
        return;
    }
    if (e.target.id === "stQ") {
        const q = e.target.value.trim().toLowerCase();
        document.querySelectorAll("[data-stn]").forEach(el => el.style.display = !q || el.dataset.stn.toLowerCase().indexOf(q) >= 0 ? "" : "none");
        return;
    }
    if (e.target.id === "adTpl") {
        adTpl[adMode] = e.target.value;
        const sel = adList.filter(x => x.on && x.line);
        const pv = document.querySelector(".adpv");
        if (pv && sel[0]) pv.textContent = adPrev(sel[0]);
    }
});
