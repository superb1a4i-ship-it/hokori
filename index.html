<link href="https://fonts.googleapis.com/css2?family=Iansui&family=Klee+One:wght@600&family=Zen+Kurenaido&family=Yomogi&family=Yusei+Magic&family=LXGW+WenKai+TC:wght@700&family=Huninn&family=Quicksand:wght@700&family=Chiron+GoRound+TC:wght@600&family=Nunito:wght@800&family=Noto+Serif+TC:wght@600&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:-apple-system,"PingFang TC","Hiragino Sans",sans-serif;color:#2a2622;background:#faf8f5;font-size:16px}
header{position:sticky;top:0;background:#faf8f5;border-bottom:1px solid #e8e2da;padding:10px 12px 8px;z-index:5}
h1{font-size:18px;margin:0 0 6px;font-weight:600}
.hint{font-size:13px;color:#7a7066;margin:6px 0 0}
.row{display:flex;gap:8px;align-items:end}
label{font-size:12px;color:#7a7066;display:block}
input,textarea{font-size:16px;width:100%;border:1px solid #d9d1c7;border-radius:8px;padding:6px 8px;background:#fff;font-family:inherit}
input{height:38px}
textarea{resize:none;line-height:1.3}
input.diff{background:#fff3d6}
input.manual{background:#eaf3de}
button{font-size:15px;height:42px;border-radius:10px;border:1px solid #6b5443;background:#fff;color:#6b5443;padding:0 12px;font-family:inherit}
button.main{background:#6b5443;color:#fff;border-color:#6b5443}
button.small{height:32px;font-size:13px;padding:0 10px}
.bar{display:flex;gap:8px;padding:10px 12px}
.bar button{flex:1}
.item{display:flex;gap:10px;padding:12px;border-bottom:1px solid #eee8e0;align-items:flex-start;background:#fff}
.item canvas{width:92px;height:auto;border-radius:6px;flex:none;align-self:flex-start;background:#eee}
.f{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.f .wide{grid-column:1/3}
.calc{font-size:13px;color:#7a7066}
.tier{display:none;grid-column:1/3;grid-template-columns:1fr 1fr;gap:6px}
.tier.open{display:grid}
.del{height:32px;padding:0 8px;border-color:#d9d1c7;color:#a32d2d;flex:none}
.empty{padding:40px 20px;text-align:center;color:#7a7066}
footer{padding:12px;display:flex;flex-direction:column;gap:8px}
#msg{font-size:15px;padding:0 12px 12px;white-space:pre-line}
#imgs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 20px}
#imgs div{aspect-ratio:3/4;background:#eee;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#imgs img{max-width:100%;max-height:100%}
#ed{position:fixed;inset:0;background:#1e1b18;z-index:20;display:none;flex-direction:column}
#ed.open{display:flex}
#edTop{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#fff}
#edTop .pills{display:flex;gap:6px}
#edTop .pills button{height:32px;font-size:13px;border-radius:999px;background:rgba(255,255,255,.92);color:#2a2622;border:none}
#edWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
#edCanvas{max-width:100%;max-height:100%;touch-action:none;border-radius:6px}
#edBot{display:flex;gap:8px;align-items:center;padding:10px 12px;color:#fff}
#edBot input[type=range]{flex:1;height:30px;padding:0;border:none;background:transparent}
#edBot button{height:40px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:30;padding:12px 12px 18px;transform:translateY(105%);transition:transform .2s ease-out;max-height:60vh;overflow:auto}
#sheet.open{transform:none}
#sheet h3{font-size:14px;margin:4px 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.opt{height:36px;font-size:14px;padding:0 12px;border-color:#d9d1c7;color:#2a2622}
.opt.on{border:2px solid #6b5443;color:#6b5443}
.sw{width:32px;height:32px;border-radius:50%;border:1px solid #bfb5aa;padding:0}
.sw.on{outline:2px solid #6b5443;outline-offset:2px}

#tabs{display:flex;position:sticky;top:0;z-index:8;background:#fff;border-bottom:1px solid #e8e2da}
#tabs button{flex:1;height:46px;border:none;border-radius:0;background:#fff;color:#7a7066;font-size:16px}
#tabs button.on{color:#6b5443;font-weight:600;box-shadow:inset 0 -3px 0 #6b5443}
#tabMake header{top:46px}
.pcard{background:#fff;border-bottom:8px solid #f1ece5;padding:12px}
.phead{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start}
.phead img,.phead .noimg{width:64px;height:84px;object-fit:cover;border-radius:6px;background:#eee;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#7a7066;text-align:center}
.pname{font-size:16px;font-weight:600}
.pmeta{font-size:13px;color:#7a7066}
.pcnt{font-size:15px;margin-top:4px}
.lack{color:#a32d2d;font-weight:600}.full{color:#3b6d11;font-weight:600}
.icons{display:flex;gap:6px;flex:1 1 100%;justify-content:flex-end;flex-wrap:wrap}
.icons button{height:36px;padding:0 10px;font-size:14px}
.line{display:flex;align-items:center;gap:6px;border-radius:8px;padding:6px 8px;margin-top:6px;font-size:15px}
.line .nm{flex:1;min-width:0}
.line2{border-radius:10px;padding:5px 8px;margin-top:4px}
.lph{flex:none;width:40px;min-width:40px;max-width:40px;height:40px;border-radius:8px;border:1px dashed #b9ada0;background:#fff;padding:0;font-size:20px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.lph img{width:100%;height:100%;object-fit:cover}
.lph.has{border-style:solid;border-color:#d9d1c7}
.pv{position:fixed;inset:0;background:rgba(20,17,15,.93);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.pv img{max-width:100%;max-height:70vh;border-radius:8px;background:#fff}
.pv .t{color:#fff;margin-top:10px;font-size:15px;text-align:center}
.pv .bt{display:flex;gap:8px;margin-top:14px;width:100%;max-width:420px}
.pv .bt button{flex:1;height:46px;border-radius:10px;border:none;font-size:15px}
.line2 .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.line2 .cn{font-size:15px;line-height:1.35;word-break:break-all}
.line2 .r2{display:flex;align-items:center;gap:6px;margin-top:3px}
.line2 button{height:32px;min-width:32px;padding:0 8px;border-color:rgba(0,0,0,.25);color:inherit;background:rgba(255,255,255,.6);font-size:15px}
.line2 .ic{border:none;background:transparent;padding:0 4px}
.line2 .wantb{border-style:dashed;border-color:currentColor;font-size:15px;padding:0 8px;height:36px}
.line2 .wantb .bn{font-size:21px;font-weight:700;min-width:0;margin:0 1px}
.line2 .gotn{font-size:24px;font-weight:700;min-width:26px}
.line2 b{min-width:20px;text-align:center;font-weight:600}
.line2 .lk{font-size:16px;font-weight:700;color:#a32d2d;min-width:44px;text-align:right}
.line2 .lk.ok{color:#3b6d11}
.line{gap:4px;padding:5px 6px}
.sp{font-size:12px;border:1px solid currentColor;border-radius:999px;padding:1px 8px;margin-left:4px;white-space:nowrap}
.dots{border:none!important;background:transparent!important;font-size:18px!important;padding:0 4px!important;min-width:24px!important}
.reorder .pcard{user-select:none;-webkit-user-select:none;padding:8px 12px;border-bottom-width:4px}
.reorder .pcard .line2,.reorder .pcard .icons,.reorder .pcard .addc,.reorder .pcard .pmeta,.reorder .pcard .pcnt,.reorder .pcard .mkp,.reorder .pcard .warn{display:none}
.reorder .phead img,.reorder .phead .noimg{width:44px;height:56px}
.reorder .phead{align-items:center;flex-wrap:nowrap}
.rbtns{display:none;gap:6px;align-items:center;flex:none}
.reorder .rbtns{display:flex}
.rbtns button{height:40px;padding:0 8px;font-size:13px;white-space:nowrap}
.hdl{touch-action:none;font-size:24px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px dashed #b9ada0;border-radius:8px;color:#6b5443;background:#fff;flex:none}
.pcard.drag{opacity:.95;box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;z-index:5;outline:2px solid #6b5443}
.mkb{flex:none;width:30px;min-width:30px;height:30px;padding:0;border-radius:8px;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.7);font-size:16px;margin-right:4px}
.mkp{display:flex;gap:10px;align-items:center;padding:8px 10px;margin-top:4px;background:#fff;border:1px solid #d9d1c7;border-radius:10px}
.mkp button{width:38px;height:38px;border-radius:50%;padding:0;border:2px solid rgba(0,0,0,.25);font-size:14px}
.tms{font-size:12px;opacity:.8;margin-top:3px;line-height:1.5}
.line2.ln{padding:6px 8px 6px 6px;border-radius:12px;margin-top:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.ln .r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ln .dot{width:22px;min-width:22px;height:22px;border-radius:50%;padding:0;border:2px solid rgba(0,0,0,.28);flex:none}
.ln .cnb{flex:1 1 80px;min-width:0;height:auto;min-height:34px;text-align:left;border:none;background:transparent;padding:2px 0;font-size:15px;font-weight:600;color:inherit;line-height:1.3;word-break:break-all}
.ln .qg{display:flex;align-items:center;gap:4px;margin-left:auto}
.ln .wantb{height:34px;padding:0 7px;margin-right:4px}
.ln .pm{width:34px;min-width:34px;height:34px;padding:0}
.ln .gotn{font-size:22px;min-width:24px}
.ln .lk{font-size:15px;min-width:38px}
.ln .sub{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;font-size:12px;opacity:.85;margin:2px 0 0 28px;line-height:1.5}
.ln .spb{height:26px;min-width:0;font-size:12px;padding:0 8px;border-radius:999px;border:1px solid currentColor;background:transparent}
.lph.sm{width:30px;min-width:30px;max-width:30px;height:30px;border-radius:6px;padding:0}
.as{position:fixed;inset:0;background:rgba(20,17,15,.45);z-index:9999;display:flex;align-items:flex-end}

function hsl(hex) {
    let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);

}

function layout(ctx, it, W) {

    const tW = tierTxt ? ctx.measureText(tierTxt).width : 0;

            ny += L.base * 1.4;
        });
        const lx = x + L.pad + L.nW + L.gap;
        ctx.globalAlpha = .35;
        ctx.lineWidth = Math.max(1, L.base * .06);
        ctx.beginPath();
        ctx.moveTo(lx, y + L.pad * .6);
        ctx.lineTo(lx, y + L.h - L.pad * .6);
        ctx.stroke();
        ctx.globalAlpha = 1;
        const rx = lx + L.gap, blockH = L.pH + L.tH;
        let py = y + L.h / 2 - blockH / 2 + L.pH * .82;
        priceRow(rx, py, "l");
        if (L.tierTxt) {
            ctx.font = L.tf;
            ctx.fillText(L.tierTxt, rx, py + L.tH);
        }
    } else {
        ctx.textAlign = "left";
        const cx = x + L.w / 2;
        let cy = y + L.pad * .7;
        if (L.nameLines.length) {
            ctx.font = L.nf;
            L.nameLines.forEach(t => {
                const tw = ctx.measureText(t).width;
                cy += L.base * 1.4;
                ctx.fillText(t, cx - tw / 2, cy - L.base * .35);
            });
            ctx.globalAlpha = .3;
            ctx.lineWidth = Math.max(1, L.base * .06);
            ctx.beginPath();
            ctx.moveTo(x + L.pad, cy + L.gap * .3);
            ctx.lineTo(x + L.w - L.pad, cy + L.gap * .3);
            ctx.stroke();
            ctx.globalAlpha = 1;
            cy += L.gap;
        }
        cy += L.pH * .82;
        priceRow(cx, cy, "c");
        if (L.tierTxt) {
            ctx.font = L.tf;
            const tw = ctx.measureText(L.tierTxt).width;
            ctx.fillText(L.tierTxt, cx - tw / 2, cy + L.tH);
        }
    }
    ctx.restore();
    return {
        x: x,
        y: y,
        w: L.w,
        h: L.h
    };
}

function render(c, it) {
    const img = it.img;
    if (!img) return;
    const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
    c.width = Math.round(img.width * k);
    c.height = Math.round(img.height * k);
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return drawLabel(ctx, it, c.width, c.height);
}

const tried = new Set;

function textOf(it) {
    return (it.name.value || "") + (it.tN.value || "") + "一次抽以上 每抽$" + (it.tP.value || "") + "NT$0123456789" + (it.final.value || "");
}

function needFonts(it) {
    const f = fontOf(it.st.font), txt = textOf(it), a = `${f.w} 40px "${f.cn}"`, b = `${f.w} 40px "${f.num}"`, key = a + b + txt;
    try {
        if (document.fonts.check(a, txt) && document.fonts.check(b, txt)) return null;
    } catch (e) {
        return null;
    }
    if (tried.has(key)) return null;
    tried.add(key);
    return Promise.all([ document.fonts.load(a, txt), document.fonts.load(b, txt), document.fonts.load('400 40px "Iansui"', txt) ]);
}

function draw(it) {
    render(it.canvas, it);
    if (cur === it) it.box = render($("edCanvas"), it);
    const p = needFonts(it);
    if (p) p.then(() => {
        render(it.canvas, it);
        if (cur === it) it.box = render($("edCanvas"), it);
    }).catch(() => {});
}

async function ensureFonts(st) {
    const f = fontOf(st.font);

        await Promise.all([ document.fonts.load(`${f.w} 40px "${f.cn}"`, "吉伊卡哇"), document.fonts.load(`${f.w} 40px "${f.num}"`, "NT$0123456789") ]);

async function openEd(it) {

function toCanvas(e) {
    const r = edC.getBoundingClientRect();
    return {
        x: (e.clientX - r.left) * edC.width / r.width,
        y: (e.clientY - r.top) * edC.height / r.height
    };
}

edC.addEventListener("pointerdown", e => {
    if (!cur) return;
    edC.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, e);
    if (ptrs.size === 2) {
        const [a, b] = [ ...ptrs.values() ];
        pinch = {
            d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
            s: cur.st.size
        };
        drag = null;
        return;
    }
    const p = toCanvas(e), bx = cur.box;
    drag = {
        sx: p.x,
        sy: p.y,
        px: cur.pos.x,
        py: cur.pos.y,
        hit: bx && p.x >= bx.x && p.x <= bx.x + bx.w && p.y >= bx.y && p.y <= bx.y + bx.h
    };
    if (!drag.hit) {
        cur.pos = {
            x: p.x / edC.width,
            y: p.y / edC.height
        };
        drag = {
            sx: p.x,
            sy: p.y,
            px: cur.pos.x,
            py: cur.pos.y,
            hit: true
        };
        draw(cur);
    }
});

edC.addEventListener("pointermove", e => {
    if (!cur || !ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, e);
    if (pinch && ptrs.size === 2) {
        const [a, b] = [ ...ptrs.values() ];
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        cur.st.size = Math.max(.5, Math.min(2.5, pinch.s * d / pinch.d));
        $("edSize").value = Math.round(cur.st.size * 100);
        draw(cur);
        return;
    }
    if (drag && drag.hit) {
        const p = toCanvas(e);
        cur.pos = {
            x: drag.px + (p.x - drag.sx) / edC.width,
            y: drag.py + (p.y - drag.sy) / edC.height
        };
        draw(cur);
    }
});

[ "pointerup", "pointercancel" ].forEach(t => edC.addEventListener(t, e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (!ptrs.size) drag = null;
}));

let running = false, knownV = null, waiters = [], fadeT = null, failN = 0;

let PHOTOFAIL = [];

function showPhotoFail() {
    if (!PHOTOFAIL.length) return;
    bar("bad", "⚠ 照片沒存到：" + PHOTOFAIL.join("、") + "——請在那一行重拍（" + (window.__V || "") + "）");
}

const saveOps = () => {
    try {
        localStorage.setItem(OPK, JSON.stringify(ops));
    } catch (e) {
        if (ops.some(o => o.fn === "採買_設行照")) bar("bad", "⚠ 照片太大，手機暫存放不下：照片還在上傳，上傳完之前不要關網頁（" + (window.__V || "") + "）");
    }
};

const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function bar(kind, text) {
    const b = $("syncBar");
    if (!b) return;
    clearTimeout(fadeT);
    b.className = "sb " + kind;
    b.textContent = text;
    b.style.display = "block";
    if (kind === "ok") fadeT = setTimeout(() => {
        b.style.display = "none";
    }, 2500);
}

function syncTag() {
    if (!ops.length && PHOTOFAIL.length) {
        showPhotoFail();
        return;
    }
    if (ops.length) bar(failN ? "bad" : "wait", failN ? "⚠ 網路不穩，還有 " + ops.length + " 筆沒存，會自動重試（先不要關網頁）" : "⏳ 同步中…（" + ops.length + "）先不要關網頁"); else bar("ok", "✓ 都存好了");
}

function enqueue(fn, args) {
    ops.push({
        fn: fn,
        args: args,
        n: 0
    });
    saveOps();
    syncTag();
    pump();
}

const BATCHABLE = [ "採買_加客人", "採買_改數", "採買_刪客人", "採買_刪商品", "採買_改商品", "採買_排序", "採買_改扭日", "採買_標記", "採買_清行照" ];

function pump() {
    if (running || !ops.length) return;
    let n = 0;
    while (n < ops.length && n < 30 && BATCHABLE.includes(ops[n].fn)) n++;
    if (n >= 2) {
        running = true;
        const head = ops[0];
        google.script.run.withSuccessHandler(j => {
            let r = {};
            try {
                r = JSON.parse(j);
            } catch (er) {}
            if (r.v && /^\d+$/.test(r.v)) knownV = r.v;
            ops.splice(0, Math.min(n, r.done || 0));
            saveOps();
            running = false;
            if (r.err) {
                if (ops.length) ops[0].n = (ops[0].n || 0) + 1;
                failN++;
                saveOps();
                if (ops.length && ops[0].n >= 4) {
                    ops.shift();
                    saveOps();
                    failN = 0;
                    alert("有一筆存不進去（" + r.err + "），畫面會重新讀一次，請檢查（" + (window.__V || "") + "）");
                    load();
                    pump();
                    return;
                }
                syncTag();
                setTimeout(pump, 3e3);
                return;
            }
            failN = 0;
            syncTag();
            if (!ops.length) waiters.splice(0).forEach(f => f());
            pump();
        }).withFailureHandler(e => {
            running = false;
            head.n = (head.n || 0) + 1;
            failN++;
            saveOps();
            syncTag();
            setTimeout(pump, 3e3);
        }).採買_批次(JSON.stringify(ops.slice(0, n).map(o => ({
            fn: o.fn,
            args: o.args
        }))));
        return;
    }
    running = true;
    const op = ops[0];
    google.script.run.withSuccessHandler(v => {
        if (typeof v === "string" && /^\d+$/.test(v)) knownV = v;
        if (op.fn === "採買_設行照" && PHOTOFAIL.length) {
            let l = null;
            try {
                l = lineOf(op.args[0]);
            } catch (e) {}
            if (l) PHOTOFAIL = PHOTOFAIL.filter(x => x !== l.cust && x.indexOf(l.cust + "　") !== 0);
        }
        ops.shift();
        saveOps();
        running = false;
        failN = 0;
        syncTag();
        if (!ops.length) waiters.splice(0).forEach(f => f());
        pump();
    }).withFailureHandler(e => {
        running = false;
        op.n = (op.n || 0) + 1;
        failN++;
        saveOps();
        if (op.n >= 4) {
            ops.shift();
            saveOps();
            failN = 0;
            if (op.fn === "採買_設行照") {
                let l = null;
                try {
                    l = lineOf(op.args[0]);
                } catch (e) {}
                const who = l ? l.cust : "";
                PHOTOFAIL.push(who);
                showPhotoFail();
                alert("⚠ " + who + " 這一行的照片沒存到雲端（" + (e.message || e) + "）。\n請在那一行再拍／選一次照片。");
            } else alert("有一筆存不進去（" + (e.message || e) + "），畫面會重新讀一次，請檢查");
            load();
            pump();
            return;
        }
        syncTag();
        setTimeout(pump, 3e3);
    })[op.fn](...op.args);
}

function flush() {
    return new Promise(r => {
        if (!ops.length && !running) r(); else {
            waiters.push(r);
            pump();
        }
    });
}

window.addEventListener("beforeunload", e => {
    if (ops.length) {
        e.preventDefault();
        e.returnValue = "還有資料沒存完";
    }
});

function checkV() {
    if (!B || ops.length || running || $("tabBuy").style.display === "none") return;
    google.script.run.withSuccessHandler(v => {
        if (knownV && v && v !== knownV) loadQuiet();
    }).採買_版本();
}

setInterval(checkV, 3e4);

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") checkV();
});

let saveBT = null;

function saveB() {
    clearTimeout(saveBT);
    saveBT = setTimeout(() => {
        try {
            if (B) localStorage.setItem("hokoriB", JSON.stringify(B, (k, v) => k === "local" || k === "lpLocal" || k === "lpBusy" ? undefined : v));

}

function cachedB() {
    try {
        const c = JSON.parse(localStorage.getItem("hokoriB") || "null");
        return c && c.products ? c : null;
    } catch (e) {
        return null;
    }
}

let quietRun = false;

async function loadQuiet() {
    if (quietRun) return;
    quietRun = true;
    try {
        if (ops.length || running) await flush();
        const j = await new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).採買_讀取(logDays));
        if (ops.length || running) {
            quietRun = false;
            setTimeout(loadQuiet, 1500);
            return;
        }
        let raw0 = "";
        try {
            raw0 = localStorage.getItem("hokoriBraw") || "";
        } catch (e) {}
        const nb = JSON.parse(j);
        knownV = nb.v;
        try {
            localStorage.setItem("hokoriBraw", j);
        } catch (e) {}
        if (j !== raw0 || !B) {
            const keep = {};
            if (B) B.products.forEach(p => {
                if (p.local) keep["p" + p.id] = p.local;
                p.lines.forEach(l => {
                    if (l.lpLocal) keep["l" + l.id] = l.lpLocal;
                });
            });
            nb.products.forEach(p => {
                if (keep["p" + p.id] && !p.photo) p.local = keep["p" + p.id];
                p.lines.forEach(l => {
                    if (keep["l" + l.id] && !l.lp) l.lpLocal = keep["l" + l.id];
                });
            });
            B = nb;
            if (!reorder) renderB();
            if (raw0) bar("ok", "✓ 已更新成最新的");
        } else if ($("syncBar").classList.contains("wait") && !ops.length) bar("ok", "✓ 已經是最新的");
    } catch (e) {
        bar("bad", "⚠ 讀不到最新資料（" + (e && e.message || e) + "）畫面是上次的，請按這裡重新整理（" + (window.__V || "") + "）");
        $("syncBar").classList.add("chg");
    }
    quietRun = false;
}

async function load() {
    if (ops.length) {
        bar("wait", "🔄 補存上次沒存完的 " + ops.length + " 筆…");
        await flush();
        bar("ok", "✓ 已補存上次沒存完的資料");
    }
    const j = await call("採買_讀取", logDays);
    B = JSON.parse(j);
    knownV = B.v;
    try {
        localStorage.setItem("hokoriBraw", j);
    } catch (e) {}
    renderB();
}

    B = JSON.parse(j);

}

    }).join("");
    $("logs").innerHTML = B.log.length ? B.log.map(x => `<div class="logrow">${esc(x.t.slice(5))}　${esc(x.cust)}　${esc(x.name)} ×${x.n}</div>`).join("") : '<div class="logrow" style="color:#7a7066">還沒有入單紀錄</div>';

function addBox(p) {
    return `<div class="addc"><div style="font-size:13px;color:#7a7066;margin-bottom:4px">加客人：打名字裡任何兩個字</div><div class="row"><input class="kw" placeholder="例：依哈" style="flex:1"><div style="width:122px"><label>要幾個</label><div style="display:flex;align-items:center;gap:4px"><button class="pm" data-qm="1" aria-label="少一個">－</button><b class="qtyv" style="min-width:24px;text-align:center;font-size:18px">1</b><button class="pm" data-qp="1" aria-label="多一個">＋</button></div></div></div><div style="font-size:12px;color:#7a7066;margin-top:4px">💡 同一位客人要追加：再加一次，會分成新的一行、入單也是分開的一列（不會合計）</div><div class="sug"></div><button class="small" data-x="1" style="margin-top:8px">取消</button></div>`;
}

function renderSug(kw) {
    const el = document.querySelector(".addc .sug");
    if (!el) return;
    const k = norm(kw);
    if (k.length < 1) {
        el.innerHTML = "";
        return;
    }
    const parts = [];
    for (let i = 0; i < k.length - 1; i++) parts.push(k.slice(i, i + 2));
    const exact = B.names.filter(n => norm(n).includes(k)).slice(0, 8);
    const score = n => {
        const nn = norm(n);
        let c = 0;
        for (const ch of new Set(k)) if (nn.includes(ch)) c++;
        return c / new Set(k).size;
    };
    const like = exact.length ? [] : B.names.map(n => [ n, score(n) ]).filter(x => x[1] >= .5).sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
    let h = exact.map(n => `<button data-pick="${esc(n)}">${esc(n)}</button>`).join("");
    if (!exact.length && like.length) h = '<div style="font-size:13px;color:#a32d2d;margin-top:6px">找不到完全一樣的，你是不是要：</div>' + like.map(n => `<button data-pick="${esc(n)}">${esc(n)}</button>`).join("");
    if (!B.names.some(n => norm(n) === k)) h += exact.length || like.length ? `<div style="margin-top:10px;font-size:12px;color:#7a7066">上面都不是？<button class="new small" data-new="${esc(kw.trim())}">＋ 這是新客人：${esc(kw.trim())}</button></div>` : `<div style="margin-top:6px"><button class="new" data-new="${esc(kw.trim())}">＋ 這是新客人：${esc(kw.trim())}</button></div>`;
    el.innerHTML = h;
}

const lineOf = id => B.products.flatMap(p => p.lines).find(l => l.id === id);

function actSheet(title, btns) {
    const d = document.createElement("div");
    d.className = "as";
    d.innerHTML = `<div class="in"><div class="t">${esc(title)}</div></div>`;
    btns.forEach(([t, fn, cls]) => {
        const b = document.createElement("button");
        b.textContent = t;
        if (cls) b.className = cls;
        if (!fn) b.className = "x";
        b.onclick = () => {
            d.remove();
            if (fn) fn();
        };
        d.querySelector(".in").appendChild(b);
    });
    d.onclick = e => {
        if (e.target === d) d.remove();
    };
    document.body.appendChild(d);
}

function fakeClick(k, v) {
    const b = document.createElement("button");
    b.dataset[k] = v;
    plistHandler({
        target: b
    });
}

function moveLine(p, l, w) {
    const a = p.lines, i = a.indexOf(l);
    if (i < 0) return;
    a.splice(i, 1);
    const j = w === "top" ? 0 : w === "up" ? Math.max(0, i - 1) : Math.min(a.length, i + 1);
    a.splice(j, 0, l);
    renderB();
    enqueue("採買_客人排序", [ p.id, JSON.stringify(a.map(x => x.id)) ]);
}

function lineMenu(l) {
    const p = B.products.find(x => x.lines.includes(l));
    if (!p) return;
    const i = p.lines.indexOf(l), n = p.lines.length, btns = [];
    if (i > 0) btns.push([ "⬆ 移到最上（優先給這位）", () => moveLine(p, l, "top") ], [ "↑ 上移一格", () => moveLine(p, l, "up") ]);
    if (i < n - 1) btns.push([ "↓ 下移一格", () => moveLine(p, l, "down") ]);
    btns.push([ "✎ 改要幾個", () => fakeClick("ew", l.id) ]);
    btns.push([ l.lp || l.lpLocal ? "📷 看／換這位客人的照片" : "📷 加這位客人的照片", () => fakeClick("lp", l.id) ]);

    btns.push([ "🗑 刪掉這位客人", () => fakeClick("dl", l.id), "del" ], [ "✕ 關閉", null ]);

function allText(ps) {
    return ps.map(p => {
        const got = p.lines.filter(l => l.got > 0), lack = p.lines.filter(l => l.want > l.got);

function copyMenu(ps, title) {
    actSheet(title, [ [ "📋 只複製還沒買到的", () => copyText(lackText(ps)) ], [ "📋 全部（已買到＋還沒買到，分開列）", () => copyText(allText(ps)) ], [ "✕ 關閉", null ] ]);
}

const plistHandler = async e => {
    if (reorder) {
        const rb = e.target.closest("button");
        if (!rb || !(rb.dataset.top || rb.dataset.bot)) return;
        const c = rb.closest(".pcard"), L = $("plist");
        if (rb.dataset.top) L.insertBefore(c, L.firstElementChild); else L.appendChild(c);
        c.scrollIntoView({
            block: "center"
        });
        c.classList.add("drag");
        setTimeout(() => c.classList.remove("drag"), 600);
        return;
    }
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    if (d.cm) {
        const l = lineOf(d.cm);
        if (l) lineMenu(l);
        return;
    }
    if (d.mk) {
        editMk = editMk === d.mk ? null : d.mk;
        renderB();
        return;
    }
    if (d.mkset !== undefined) {
        const l = lineOf(editMk);
        editMk = null;
        if (l) {
            l.mk = d.mkset;
            enqueue("採買_標記", [ l.id, d.mkset ]);
        }
        renderB();
        return;
    }
    if (d.fd) {
        if (FOLD[d.fd]) delete FOLD[d.fd]; else FOLD[d.fd] = 1;
        saveFold();
        renderB();
        return;
    }
    if (d.ac) {
        openAdd = d.ac;
        editWant = null;
        if (FOLD[d.ac]) {
            delete FOLD[d.ac];
            saveFold();
        }
        renderB();
        return;
    }
    if (d.x) {
        openAdd = null;
        editWant = null;
        editSplit = null;
        renderB();
        return;
    }
    if (d.sp) {
        editSplit = d.sp;
        editWant = null;
        openAdd = null;
        renderB();
        const i = document.querySelector(".addc .ns");
        if (i) {
            i.focus();
            i.select();
        }
        return;
    }
    if (d.spok) {
        const l = lineOf(d.spok);
        const v = Math.max(0, Math.min(l.want, parseInt(document.querySelector(".addc .ns").value) || 0));
        l.split = v;
        editSplit = null;
        renderB();
        enqueue("採買_改數", [ l.id, "split", v ]);
        return;
    }
    if (d.cp) {
        const p = B.products.find(x => x.id === d.cp);
        copyMenu([ p ], "複製「" + pNm(p) + "」");
        return;
    }
    if (d.ew) {
        editWant = d.ew;
        openAdd = null;
        renderB();
        return;
    }
    if (d.ewok) {
        const l = lineOf(d.ewok);
        const v = Math.max(1, parseInt(document.querySelector(".addc .nwv").textContent) || 1);
        const p = B.products.find(x => x.lines.includes(l));
        const was全 = l.split >= l.want;
        l.want = v;
        l.orig = v;
        editWant = null;
        if (p && p.blind) {
            const ns = was全 ? v : Math.min(l.split, v);
            if (ns !== l.split) {
                l.split = ns;
                enqueue("採買_改數", [ l.id, "split", ns ]);
            }
        }
        renderB();
        enqueue("採買_改數", [ l.id, "want", v ]);
        return;
    }
    if (d.pick || d.new !== undefined) {
        const q = Math.max(1, parseInt(document.querySelector(".addc .qtyv").textContent) || 1);
        const pid = openAdd;
        if (d.new !== undefined && !confirm("確定「" + d.new + "」是新客人？\n（以前買過的人請改用搜尋選，不然會變成兩個人）")) return;
        const cust = d.pick || d.new;
        const p = B.products.find(x => x.id === pid);
        const ex = p ? p.lines.find(x => x.cust === cust) : null;
        if (ex && confirm("「" + cust + "」在這個商品已經有 " + ex.want + " 個了。\n\n按「確定」＝合併成同一行，變 " + (ex.want + q) + " 個（建議）\n按「取消」＝另外再加一行 " + q + " 個")) {
            openAdd = null;
            const was全 = ex.split >= ex.want;
            ex.want += q;
            ex.orig = ex.want;
            if (p.blind && was全) {
                ex.split = ex.want;
                enqueue("採買_改數", [ ex.id, "split", ex.split ]);
            }
            renderB();
            enqueue("採買_改數", [ ex.id, "want", ex.want ]);
            return;
        }
        openAdd = null;
        if (!B.names.includes(cust)) B.names.push(cust);
        const l = {
            id: newId(),
            cust: cust,
            want: q,
            got: 0,
            orig: q,
            split: p.blind ? q : 0
        };
        p.lines.push(l);
        renderB();
        enqueue("採買_加客人", [ pid, cust, q, d.new !== undefined, l.id ]);
        return;
    }
    if (d.qm || d.qp) {
        const q = document.querySelector(".addc .qtyv");
        if (q) q.textContent = Math.max(1, (+q.textContent || 1) + (d.qp ? 1 : -1));
        return;
    }
    if (d.wm || d.wp) {
        const q = document.querySelector(".addc .nwv");
        if (q) q.textContent = Math.max(1, (+q.textContent || 1) + (d.wp ? 1 : -1));
        return;
    }
    if (d.p) {
        const l = lineOf(d.p);
        const T = TK(), tm = TM();
        l.got++;
        l.d = l.d || {};
        l.d[T] = (l.d[T] || 0) + 1;
        l.t = (l.t || []).concat([ tm ]);
        renderB();
        enqueue("採買_改數", [ l.id, "got", l.got, T, tm ]);
        return;
    }
    if (d.m) {
        const l = lineOf(d.m);
        if (l.got <= 0) return;
        l.got--;
        const m = l.d || {};
        const k = Object.keys(m).sort().pop();
        if (k) {
            m[k]--;
            if (m[k] <= 0) delete m[k];
        }
        if (l.t && l.t.length) l.t = l.t.slice(0, -1);
        renderB();
        enqueue("採買_改數", [ l.id, "got", l.got, TK() ]);
        return;
    }
    if (d.ed) {
        editDates(lineOf(d.ed));
        return;
    }
    if (d.lp) {
        const l = lineOf(d.lp);
        if (!l || l.lpBusy) return;
        const src = l.lpLocal || (l.lp ? `${PH(l.lp, 1000)}` : "");
        if (!src) {
            pickLinePhoto(l.id);
            return;
        }
        photoSheet(src, l.cust + " 的照片", [ [ "🔄 換一張", () => pickLinePhoto(l.id) ], [ "🗑 拿掉照片", () => {
            if (!confirm("拿掉 " + l.cust + " 這一行的照片？")) return;
            l.lp = "";
            l.lpLocal = "";
            renderB();
            enqueue("採買_清行照", [ l.id ]);
        } ], [ "✕ 關閉", null ] ]);
        return;
    }
    if (d.pp) {
        const p = B.products.find(x => x.id === d.pp);
        if (!p) return;
        const src = p.local || (p.photo && !p.home ? `${PH(p.photo, 1000)}` : "");
        const chg = () => pickPhoto(data => {
            p.local = data;
            p.home = false;
            p.photo = "";
            renderB();
            enqueue("採買_換商品照", [ p.id, data.split(",")[1], newId() ]);
        });
        if (!src) {
            chg();
            return;
        }
        photoSheet(src, pNm(p) + "（換照片只改這次，不改商品庫）", [ [ "🔄 換一張", chg ], [ "✕ 關閉", null ] ]);
        return;
    }
    if (d.all) {
        const p = B.products.find(x => x.id === d.all);
        if (!p) return;
        const ls = p.lines.filter(l => l.got < l.want);
        if (!ls.length) {
            alert("「" + pNm(p) + "」每位客人都已經買齊了");
            return;
        }
        const q = ls.reduce((a, l) => a + (l.want - l.got), 0);
        if (!confirm("把「" + pNm(p) + "」" + ls.length + " 位客人都設成買齊？\n（再加 " + q + " 個，全部共 " + p.lines.reduce((a, l) => a + l.want, 0) + " 個）\n\n真的有沒買到的，之後用 － 調回來")) return;
        const T = TK(), tm = TM();
        ls.forEach(l => {
            const add = l.want - l.got;
            if (isG(p)) {
                l.d = l.d || {};
                l.d[T] = (l.d[T] || 0) + add;
            }
            l.t = (l.t || []).concat(Array(add).fill(tm));
            l.got = l.want;
            enqueue("採買_改數", [ l.id, "got", l.got, T, tm ]);
        });
        renderB();
        return;
    }
    if (d.ep) {
        editProd(B.products.find(x => x.id === d.ep));
        return;
    }
    if (d.dl) {
        const l = lineOf(d.dl);
        if (!confirm("刪掉「" + l.cust + "」這一列？")) return;
        B.products.forEach(p => p.lines = p.lines.filter(x => x !== l));
        renderB();
        enqueue("採買_刪客人", [ l.id ]);
        return;
    }
    if (d.dp) {
        const p = B.products.find(x => x.id === d.dp);
        if (!confirm("刪掉商品「" + pNm(p) + "」和它下面所有客人？")) return;
        B.products = B.products.filter(x => x !== p);
        renderB();
        enqueue("採買_刪商品", [ p.id ]);
        return;
    }
};

const QT = [ "⏰ 要催", "⚠ 國際運費未補", "📷 缺圖", "併單中" ];

    "待處理": true

let qQuiet = false, qLast = 0;

async function qload(force) {
    if (!QD) {
        try {
            const c = JSON.parse(await DB.get("QD") || "null");
            if (c && c.orders && !QD) {
                QD = c;
                qshow = 60;
                qrender();
            }
        } catch (e) {}
    }
    if (QD && !force) {
        if (qQuiet || Date.now() - qLast < 6e4) return;
        qQuiet = true;
        const tag = document.createElement("span");
        tag.textContent = "　🔄 背景更新中…";
        $("qcount").appendChild(tag);
        google.script.run.withSuccessHandler(async j => {
            qQuiet = false;
            qLast = Date.now();
            let raw0 = "";
            try {
                raw0 = await DB.get("QD") || "";
            } catch (e) {}
            try {
                DB.set("QD", j);
            } catch (e) {}
            const nq = JSON.parse(j);
            const same = raw0 && JSON.stringify(JSON.parse(raw0).orders) === JSON.stringify(nq.orders);
            QD = nq;
            qrender();
            if (!same) bar("ok", "✓ 查訂單已更新成最新的");
        }).withFailureHandler(e => {
            qQuiet = false;
            tag.textContent = "　⚠ 更新失敗，按 🔄 再試（" + (window.__V || "") + "）";
        }).查訂單_讀取2();
        return;
    }
    $("qcount").textContent = "讀取總表中…";
    const j = await call("查訂單_讀取2");
    QD = JSON.parse(j);
    qLast = Date.now();
    try {
        DB.set("QD", j);
    } catch (e) {}
    qshow = 60;
    qrender();
}

const has = (o, k) => ({
    "全部": true,
    "待處理": !o.fh,
    "未送集運": !o.ji,
    "已送集運": o.ji,
    "未盤點": !o.pd,
    "已盤點": o.pd,
    "未發貨": !o.fh,
    "已發貨": o.fh,
    "未收訂金": !o.sent && o.dep <= 0,
    "已收訂金": o.dep > 0,
    "沒賣貨便": !o.mb,
    "有賣貨便": !!o.mb,
    "預購": o.pre,
    "非預購": !o.pre
}[k]);

const tagOf = (o, t) => ({
    "⏰ 要催": o.nag,
    "⚠ 國際運費未補": o.kuji,
    "📷 缺圖": o.nopic,
    "併單中": o.hold
}[t]);

function qpass(o) {
    for (const pair of QS) {
        const on = pair.filter(k => qst[k]);
        if (on.length === pair.length) continue;
        if (on.length && !on.some(k => has(o, k))) return false;
    }
    const tg = QT.filter(t => qtag[t]);
    if (tg.length && !tg.some(t => tagOf(o, t))) return false;
    if (qfrom || qto) {
        const d = new Date(o.mod);
        const ds = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        if (qfrom && ds < qfrom) return false;
        if (qto && ds > qto) return false;
    }
    const kw = norm($("qs").value);
    if (kw && !(norm(o.c).includes(kw) || o.rows.some(r => norm(r.n).includes(kw)))) return false;
    return true;
}

const money = n => "$" + Math.round(n).toLocaleString();

function qcard(o) {
    if (o.sent) return qcardSent(o);
    const lab = o.k === "未送集運" ? "🇯🇵 未入批" : o.pre ? "🟣 " + o.lab : "🚚 " + o.lab;
    const rows = o.rows.map(r => {
        const img = r.pic ? `<img loading="lazy" src="${PH(r.pic, 120)}" data-big="${esc(r.pic)}" data-bn="${esc(r.n)}" style="cursor:zoom-in" alt="">` : r.dep || r.acct ? '<div class="ni" style="color:#7a7066">' + (r.dep ? "訂金" : "帳") + "</div>" : '<div class="ni">沒照片</div>';
        const unit = r.dep ? "" : r.f ? `($${r.p}＋運$${r.f}) × ${r.q} ＝ ${money(r.sub)}` : `$${r.p} × ${r.q} ＝ ${money(r.sub)}`;
        return `<div class="oi">${img}<div class="t">${esc(r.n)}${r.dep ? "" : " ×" + r.q}${unit ? `<div class="u">${unit}</div>` : ""}${r.note ? `<div class="u">備註：${esc(r.note)}</div>` : ""}${r.rt ? `<div class="u" style="color:#8a5a00">↩ 上次${r.rt.sd ? " " + sdTxt(r.rt.sd) : ""}寄的那箱客人沒取、被退回，這次重寄：原本應付 ${money(r.rt.orig)}＋重寄費 ${money(r.rt.fee)}（重寄費＝運費＋包材＋人工，不賺錢）</div>` : ""}${r.kuji ? '<div class="u" style="color:#a32d2d">⚠ 國際運費未補</div>' : ""}</div><div class="s">${r.dep ? "−" + money(-r.sub) : money(r.sub)}</div></div>`;
    }).join("");
    const left = o.rev - o.dep;
    const m2 = !o.goods ? `<span style="color:#7a7066">只有訂金 ${money(o.dep)}（還沒有商品）</span>` : o.dep > 0 ? `訂金 <b>−${money(o.dep)}</b>　剩 <b style="color:#a32d2d">${money(left)}</b>` : '<span style="color:#a32d2d">💵 未收訂金</span>';
    const pl = (t, on, cls) => `<span class="pl ${on ? cls || "y" : ""}">${t}</span>`;
    const tags = [ o.nag ? pl("⏰ 要催", 1, "r") : "", o.kuji ? pl("⚠ 國際運費未補", 1, "r") : "", o.nopic ? pl("📷 缺圖", 1, "r") : "", o.hold ? pl("併單中", 1, "p") : "", o.pre ? pl("🟣 預購", 1, "p") : "" ].join("");
    return `<div class="oc${o.pre ? " pre" : ""}"><div class="oh"><div class="n">${esc(o.c)}</div><div class="b">${lab}</div></div>\n   <div class="om">收 <b style="color:#a32d2d">${money(o.rev)}</b>　本 <b>${money(o.cost)}</b>　潤 <b>${money(o.pro != null ? o.pro : o.rev - o.cost)}</b></div>${o.pk ? (o.pk.st === "先別包" ? `<div class="om" style="color:#c00000;font-weight:600">⛔ 先別包：${esc(o.pk.why.join("；"))}</div>` : `<div class="om" style="color:#555">${o.pk.st === "可以出貨" ? "✅ 阿姨已揀好，可以出貨" : (o.pk.st === "揀好等賣貨便" ? "🛍 阿姨已揀好，等客人下賣貨便" : "🧺 阿姨揀了 " + o.pk.got + "／" + o.pk.n + " 件")}${o.pk.chk ? "" : "（賣貨便金額沒記）"}</div>`) : ""}<div class="om">${m2}</div>\n   ${o.mb ? `<div class="om" style="color:#27500A">🏪 ${esc(o.mb)}</div>` : ""}${o.npd ? `<div class="om" style="color:#a32d2d">⚠ 這張有 ${o.npd} 樣還沒盤點</div>` : ""}${rows}\n   <div class="pills">${pl(o.ji ? "已送集運" : "未送集運", o.ji)}${pl(o.short ? "⚠缺" : o.pd ? "已盤點" : "未盤點", o.pd, o.short ? "r" : "y")}${pl(o.fh ? "已發貨" : "未發貨", o.fh)}${pl(o.mb ? "有賣貨便" : "沒賣貨便", !!o.mb)}${tags}</div>${qpkBtn(o)}</div>`;
}

const sdTxt = d => /^\d{4}-\d\d-\d\d$/.test(d || "") ? +d.slice(5, 7) + "/" + +d.slice(8, 10) : "（出貨日沒寫）";

function qrowsHtml(o) {
    return o.rows.map(r => {
        const img = r.pic ? `<img loading="lazy" src="${PH(r.pic, 120)}" data-big="${esc(r.pic)}" data-bn="${esc(r.n)}" style="cursor:zoom-in" alt="">` : r.dep || r.acct ? '<div class="ni" style="color:#7a7066">' + (r.dep ? "訂金" : "帳") + "</div>" : '<div class="ni">沒照片</div>';
        const unit = r.dep ? "" : r.f ? `($${r.p}＋運$${r.f}) × ${r.q} ＝ ${money(r.sub)}` : `$${r.p} × ${r.q} ＝ ${money(r.sub)}`;
        return `<div class="oi">${img}<div class="t">${esc(r.n)}${r.dep ? "" : " ×" + r.q}${unit ? `<div class="u">${unit}</div>` : ""}${r.note ? `<div class="u">備註：${esc(r.note)}</div>` : ""}${r.rt ? `<div class="u" style="color:#8a5a00">↩ 上次${r.rt.sd ? " " + sdTxt(r.rt.sd) : ""}寄的那箱客人沒取、被退回，這次重寄：原本應付 ${money(r.rt.orig)}＋重寄費 ${money(r.rt.fee)}（重寄費＝運費＋包材＋人工，不賺錢）</div>` : ""}</div><div class="s">${r.dep ? "−" + money(-r.sub) : money(r.sub)}</div></div>`;
    }).join("");
}

function qcardSent(o) {
    const paid = o.rev - o.dep;
    const pl = t => `<span class="pl">${t}</span>`;
    return `<div class="oc" style="background:#f1efec;border-color:#d8d2ca;opacity:.92"><div class="oh"><div class="n">${esc(o.c)}</div><div class="b" style="color:#5f5a54">✅ 已寄出 ${sdTxt(o.sd)}</div></div>
   <div class="om" style="color:#5f5a54">${o.k === "未送集運" || o.k === "未入批" ? "" : "📦 " + esc(o.lab) + "　"}這張已經寄出（歷史紀錄，不算在要收的錢裡）</div>
   <div class="om" style="color:#5f5a54">當時收 <b>${money(o.rev)}</b>${o.dep > 0 ? `　訂金 −${money(o.dep)}　實付 <b>${money(paid)}</b>` : ""}　本 ${money(o.cost)}　潤 ${money(o.pro != null ? o.pro : o.rev - o.cost)}</div>${o.pk && o.pk.st === "先別包" ? `<div class="om" style="color:#c00000;font-weight:600">⛔ 先別包：${esc(o.pk.why.join("；"))}</div>` : ""}${o.ret ? `<div class="om" style="color:#8a5a00;font-weight:600">↩ 這箱客人沒取、被退回了，改由${o.ret.rb ? " " + esc(o.ret.rb) + " 的" : ""}退回件重收 ${money(o.ret.amt)}（含重寄費 ${money(o.ret.fee)}）</div>` : ""}
   ${o.mb ? `<div class="om" style="color:#5f5a54">🏪 ${esc(o.mb)}</div>` : ""}${qrowsHtml(o)}
   <div class="pills">${pl("已寄出 " + sdTxt(o.sd))}</div>${qpkBtn(o)}</div>`;
}

let QPICK = new Set();

const qkey = o => o.c + "\u0001" + o.k + "\u0001" + (o.sent ? "寄" + o.sd : "");

function qpkBtn(o) {
    const on = QPICK.has(qkey(o));
    const i = QD ? QD.orders.indexOf(o) : -1;
    return `<button class="qpk" data-pk="${i}" style="display:block;width:100%;margin-top:8px;min-height:44px;font-size:15px;border-radius:8px;border:1px solid ${on ? "#3b6d11" : "#cfc6bc"};background:${on ? "#3b6d11" : "#fff"};color:${on ? "#fff" : "#2a2622"}">${on ? "☑ 已放進明細（再按取消）" : "☐ 放進明細"}</button>`;
}

function qpPicked() {
    return QD ? QD.orders.filter(o => QPICK.has(qkey(o))) : [];
}

function qpBar() {

const smoney = x => x < 0 ? "−" + money(-x) : money(x);

const qTitle0 = o => /^\d{4}-\d\d-\d\d$/.test(o.k) ? "📦 " + o.k + " 批" : o.k === "未送集運" ? "🇯🇵 還在日本" : o.k.indexOf("預購") === 0 ? "🟣 " + o.k : "📦 " + o.lab;

const qTitle = o => o.sent ? "✅ 已寄出 " + sdTxt(o.sd) + (/^\d{4}-\d\d-\d\d$/.test(o.k) ? "（" + o.k + " 批）" : "") : qTitle0(o);

const qOrd = o => (/^\d{4}-\d\d-\d\d$/.test(o.k) ? "1" + o.k : o.k === "未送集運" ? "3" : "2" + o.k) + (o.sent ? "0" + (o.sd || "") : "1");

function detailText(list) {
    const byC = {}, names = [];
    list.forEach(o => {
        if (!byC[o.c]) {
            byC[o.c] = [];
            names.push(o.c);
        }
        byC[o.c].push(o);
    });
    return names.map(c => {
        const os = byC[c].slice().sort((a, b) => qOrd(a) < qOrd(b) ? -1 : qOrd(a) > qOrd(b) ? 1 : 0);
        const L = [ "【代購明細】" + c ];
        let tot = 0, totSent = 0;
        const nSent = os.filter(o => o.sent).length, nOpen = os.length - nSent;
        os.forEach(o => {
            L.push("");
            L.push(qTitle(o));
            if (o.sent && o.ret) L.push("　↩ 這箱沒取貨、被退回，改由退回件重收（見下面）");
            let st = 0;
            const grp = [];
            o.rows.forEach(r => {
                const kind = r.dep ? 2 : r.acct ? 1 : 0;
                const key = kind + "\u0001" + r.n + "\u0001" + r.p + "\u0001" + r.f + "\u0001" + (r.kuji ? 1 : 0);
                const g = kind === 2 ? null : grp.find(x => x.key === key);
                if (g) {
                    g.q += r.q;
                    g.sub += r.sub;
                } else grp.push(Object.assign({}, r, {
                    key: key,
                    kind: kind
                }));
            });
            grp.sort((a, b) => a.kind - b.kind);
            grp.forEach(r => {
                const sub = Math.round(r.sub);
                st += sub;
                if (r.dep) {
                    L.push("・已付訂金　" + smoney(sub));
                    return;
                }
                if (r.acct) {
                    L.push("・" + String(r.n).replace(/^金額調整｜/, "") + (r.q > 1 ? " ×" + r.q + "　" + smoney(r.p) + "×" + r.q + "＝" : "　") + smoney(sub));
                    return;
                }
                const unit = r.f ? "($" + r.p + "＋國運$" + r.f + ")" : "$" + r.p;
                L.push("・" + r.n + " ×" + r.q + "　" + unit + "×" + r.q + "＝" + smoney(sub) + (r.kuji ? "（國運未補）" : ""));
                if (r.rt) L.push("　（上次寄的那箱沒取貨被退回，這次重寄：原本應付 " + money(r.rt.orig) + "＋重寄費 " + money(r.rt.fee) + "）");
            });
            if (o.sent) {
                L.push("　這張小計 " + smoney(st) + "（已經寄出，不算在這次）");
                totSent += st;
                return;
            }
            if (os.length > 1) L.push("　這張小計 " + smoney(st));
            tot += st;
        });
        L.push("");
        if (!nOpen) {
            L.push("以上都是已經寄出的");
            return L.join("\n");
        }
        L.push((nSent ? "這次要付（不含已寄出的）" : "合計") + " " + smoney(tot));
        if (tot < 20) L.push("賣貨便請填 $20，包裹內會退 " + money(20 - tot));
        return L.join("\n");
    }).join("\n\n－－－－－－\n\n");
}

let lpT = null, reorder = false, dragEl = null, dragY = 0, lastY = 0, scrollRAF = 0;

$("plist").addEventListener("pointerdown", e => {
    const c = e.target.closest(".pcard");
    if (!c) return;
    if (reorder) {
        const h = e.target.closest(".hdl");
        if (!h) return;
        e.preventDefault();
        dragEl = c;
        dragY = e.clientY;
        lastY = e.clientY;
        c.classList.add("drag");
        try {
            h.setPointerCapture(e.pointerId);
        } catch (er) {}
        cancelAnimationFrame(scrollRAF);
        scrollRAF = requestAnimationFrame(edgeScroll);
        return;
    }
    if (e.target.closest("button,input,.line2")) return;
    lpT = setTimeout(() => {
        startReorder();
    }, 600);
});

function endDrag() {
    cancelAnimationFrame(scrollRAF);
    if (dragEl) {
        dragEl.classList.remove("drag");
        dragEl.style.transform = "";
        dragEl = null;
    }
}

[ "pointerup", "pointercancel" ].forEach(t => $("plist").addEventListener(t, () => {
    clearTimeout(lpT);
    endDrag();
}));

$("plist").addEventListener("pointerleave", () => {
    clearTimeout(lpT);
});

function dragTo(y) {
    if (!dragEl) return;
    dragEl.style.transform = "translateY(" + (y - dragY) + "px)";
    for (let k = 0; k < 50; k++) {
        const dy = y - dragY;
        const prev = dragEl.previousElementSibling, next = dragEl.nextElementSibling;
        if (next && next.classList.contains("pcard") && dy > next.offsetHeight / 2) {
            next.after(dragEl);
            dragY += next.offsetHeight;
        } else if (prev && prev.classList.contains("pcard") && dy < -prev.offsetHeight / 2) {
            prev.before(dragEl);
            dragY -= prev.offsetHeight;
        } else break;
    }
    dragEl.style.transform = "translateY(" + (y - dragY) + "px)";
}

function edgeScroll() {
    if (!dragEl) return;
    const top = 150, bot = window.innerHeight - 90;
    let s = 0;
    if (lastY < top) s = -Math.min(24, 4 + (top - lastY) / 4); else if (lastY > bot) s = Math.min(24, 4 + (lastY - bot) / 4);
    if (s) {
        const before = window.scrollY;
        window.scrollBy(0, s);
        const moved = window.scrollY - before;
        if (moved) {
            dragY -= moved;
            dragTo(lastY);
        }
    }
    scrollRAF = requestAnimationFrame(edgeScroll);
}

$("plist").addEventListener("pointermove", e => {
    if (!dragEl) {
        if (lpT && Math.abs(e.movementY || 0) > 3) clearTimeout(lpT);
        return;
    }
    e.preventDefault();
    lastY = e.clientY;
    dragTo(e.clientY);
});

function drawSmall(src, w, h) {
    const c = document.createElement("canvas"), k = Math.min(1, 720 / Math.max(w, h));
    c.width = Math.max(1, Math.round(w * k));
    c.height = Math.max(1, Math.round(h * k));
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .75);
}

function readPhoto(f) {
    return new Promise((ok, ng) => {
        const viaImg = () => {
            const u = URL.createObjectURL(f), im = new Image;
            const t = setTimeout(() => ng(new Error("逾時")), 2e4);
            im.onload = () => {
                clearTimeout(t);
                try {
                    ok(drawSmall(im, im.naturalWidth || im.width, im.naturalHeight || im.height));
                } catch (e) {
                    ng(e);
                }
                URL.revokeObjectURL(u);
            };
            im.onerror = () => {
                clearTimeout(t);
                URL.revokeObjectURL(u);
                ng(new Error("讀不到"));
            };
            im.src = u;
        };
        if (window.createImageBitmap) {
            createImageBitmap(f).then(b => {
                try {
                    ok(drawSmall(b, b.width, b.height));
                } catch (e) {
                    viaImg();
                }
            }).catch(viaImg);
        } else viaImg();
    });
}

    $("popIn").innerHTML = `<div style="font-weight:600;margin-bottom:6px">加商品</div><input id="lk" placeholder="從商品庫找：打品名裡的幾個字（例：扭蛋 400）">\n  <div id="lres" style="max-height:46vh;overflow:auto;margin-top:6px"></div>\n  <div class="row" style="margin-top:10px"><button class="main" id="aNew" style="flex:1">📷 選照片新增</button><button class="main" id="aNoP" style="flex:1">✏️ 不用照片，直接新增</button></div><div class="row" style="margin-top:6px"><button id="aX0" style="flex:1">取消</button></div>\n  <p class="hint">💡 以前入過單的商品會在這裡：<b>點照片＝放大看</b>，<b>點文字＝選這個</b>（帶入品名、價錢、照片）。這次改價錢只影響這次，不會改到商品庫。</p>`;
    $("pop").classList.add("open");
    $("aX0").onclick = () => $("pop").classList.remove("open");
    $("aNew").onclick = () => {
        $("pop").classList.remove("open");
        $("pickP").click();
    };
    $("aNoP").onclick = () => openAddP(null, null);
    const show = () => {
        const el = $("lres");
        if (!el) return;
        const k = norm($("lk").value);
        if (!LIB) {
            el.innerHTML = '<div class="hint">讀取商品庫中…</div>';
            return;
        }
        if (!k) {
            el.innerHTML = "";
            return;
        }
        const hit = LIB.map((x, i) => [ x, i ]).filter(([x]) => norm(x.name).includes(k)).slice(0, 30);
        el.innerHTML = hit.length ? hit.map(([x, i]) => `<div data-li="${i}" style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee8e0">${x.photo ? `<img src="${PH(x.photo, 120)}" style="width:46px;height:46px;object-fit:cover;border-radius:6px" alt="">` : '<div class="noimg" style="width:46px;height:46px;font-size:10px">沒照片</div>'}<div style="flex:1;font-size:14px">${esc(x.name)}<div style="font-size:12px;color:#7a7066">¥${x.jpy}｜$${x.price}${x.kuji && !(x.ship > 0) ? '｜<b style="color:#a32d2d">⚠ 國際運費未填</b>' : ""}</div></div></div>`).join("") : '<div class="hint">商品庫沒有，按下面「選照片新增」</div>';
    };
    $("lk").oninput = show;
    show();
    $("lres").onclick = e => {
        const t = e.target.closest("[data-li]");
        if (!t) return;
        const x = LIB[+t.dataset.li];
        if (e.target.tagName === "IMG" && x.photo) {
            bigImg(x.photo, x.name);
            return;
        }
        openAddP(null, x);
    };
    if (!LIB) google.script.run.withSuccessHandler(j => {
        LIB = JSON.parse(j);
        show();
    }).withFailureHandler(() => {
        LIB = [];
        show();
    }).採買_商品庫();
};

$("pickP").onchange = e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const img = new Image;
    img.onload = () => openAddP(img);
    img.src = URL.createObjectURL(file);
};

function openAddP(img, preset) {
    let data = "";
    if (img) {
        const c = document.createElement("canvas"), k = Math.min(1, 1200 / Math.max(img.width, img.height));
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        data = c.toDataURL("image/jpeg", .85);
    }
    const pv = data ? `<img src="${data}" style="width:84px;border-radius:6px;align-self:flex-start">` : preset && preset.photo ? `<img src="${PH(preset.photo, 200)}" style="width:84px;border-radius:6px;align-self:flex-start">` : '<div class="noimg" style="width:84px;height:84px">沒有照片</div>';
    $("pop").dataset.soft = "";
    $("popIn").innerHTML = `<div style="display:flex;gap:10px">${pv}<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px">\n   <div style="grid-column:1/3"><label>品名</label><input id="aN"></div><div><label>日幣成本（¥）</label><input id="aJ" type="number" inputmode="numeric" placeholder="¥"></div><div><label>台幣售價（NT$）</label><input id="aP" type="number" inputmode="numeric" placeholder="NT$"></div>\n   <div style="grid-column:1/3;font-size:12px;color:#7a7066">打日幣會用整批匯率 ${esc(S.rate || "0.28")} 自動算台幣，可以自己改</div>\n   <div style="grid-column:1/3;font-size:12px;color:#7a7066">💡 品名開頭是「扭蛋」的，扭到時按 ＋ 會記下扭日期（不同天會自動分成不同列，盤點時一袋一袋對）</div>\n   <label style="grid-column:1/3;display:flex;align-items:center;gap:6px;font-size:14px;color:#2a2622"><input id="aB" type="checkbox" style="width:22px;height:22px">盲抽（預設全拆；不拆的帶這張照片）</label>\n   <label style="grid-column:1/3;display:flex;align-items:center;gap:6px;font-size:14px;color:#2a2622"><input id="aH" type="checkbox" style="width:22px;height:22px">扭蛋等：照片回家補（不上傳這張）</label>\n   <div style="grid-column:1/3"><button class="small" id="aT">＋多抽優惠</button></div>\n   <div id="aTb" style="grid-column:1/3;display:none;grid-template-columns:1fr 1fr;gap:6px"><div><label>幾個以上</label><input id="aTn" type="number" inputmode="numeric" placeholder="3"></div><div><label>每個多少</label><input id="aTp" type="number" inputmode="numeric"></div></div>\n  </div></div><div class="row" style="margin-top:12px"><button id="aX" style="flex:1">取消</button><button class="main" id="aOk" style="flex:2">加進採買清單</button></div><p class="hint" id="aMsg">💡 品名、售價不知道可以先空著，之後按 ✏️ 補（沒補的不會被入單）</p>`;
    $("pop").classList.add("open");
    let manual = !!preset;
    if (!img && !(preset && preset.photo)) {
        $("aH").checked = true;
        $("aB").checked = false;
    }
    if (preset) {
        $("aN").value = preset.name;
        $("aJ").value = preset.jpy || "";
        $("aP").value = preset.price || "";
        if (preset.tierN && preset.tierP) {
            $("aTb").style.display = "grid";
            $("aTn").value = preset.tierN;
            $("aTp").value = preset.tierP;
        }
    }
    const calcP = () => {
        if (manual) return;
        const j = parseFloat($("aJ").value) || 0, r = parseFloat(S.rate || $("rate").value) || 0;
        $("aP").value = j ? Math.round(j * r / 10) * 10 : "";
    };
    $("aJ").oninput = calcP;
    $("aP").oninput = () => {
        manual = true;
    };
    if (preset && preset.tierN && preset.tierP) $("aT").textContent = "－收起多抽優惠";
    $("aT").onclick = () => {
        const o = $("aTb").style.display === "none";
        $("aTb").style.display = o ? "grid" : "none";
        $("aT").textContent = o ? "－收起多抽優惠" : "＋多抽優惠";
    };
    $("aB").onchange = () => {
        if ($("aB").checked) $("aH").checked = false;
    };
    $("aH").onchange = () => {
        if ($("aH").checked) $("aB").checked = false;
    };
    $("aX").onclick = () => $("pop").classList.remove("open");
    $("aOk").onclick = async () => {
        const o = {
            name: $("aN").value.trim(),
            jpy: $("aJ").value,
            price: $("aP").value,
            ship: 0,
            home: $("aH").checked,
            blind: $("aB").checked,
            tierN: $("aTb").style.display === "none" ? "" : $("aTn").value,
            tierP: $("aTb").style.display === "none" ? "" : $("aTp").value
        };
        o.price = String(o.price).trim();
        if (o.price !== "" && !(parseFloat(o.price) >= 0)) {
            $("aMsg").textContent = "售價要打數字（送的東西打 0；不知道就空著）";
            return;
        }
        if (o.tierN && !o.tierP || !o.tierN && o.tierP) {
            $("aMsg").textContent = "多抽優惠要填「幾個以上」和「每個多少」兩格";
            return;
        }
        const pid = newId();
        o.pid = pid;
        if (!data && preset && preset.photo && !o.home) o.photoId = preset.photo;
        $("pop").classList.remove("open");
        B.products.unshift({
            id: pid,
            name: o.name,
            photo: o.photoId || "",
            local: !o.home && data ? data : "",
            jpy: +o.jpy || 0,
            price: o.price === "" ? 0 : +o.price,
            noPrice: o.price === "",
            ship: 0,
            tierN: +o.tierN || 0,
            tierP: +o.tierP || 0,
            home: o.home,
            blind: o.blind,
            lines: []
        });
        openAdd = pid;
        renderB();
        enqueue("採買_加商品", [ JSON.stringify(o), o.home || o.photoId || !data ? "" : data.split(",")[1] ]);
    };
}

  <p class="hint">💡 改這裡只會改採買清單上的商品（客人都還在），不會改到商品庫。多抽優惠不用就兩格都空白。品名、售價還不知道可以先空著。</p><div class="row" style="margin-top:8px"><button id="eX" style="flex:1">取消</button><button class="main" id="eOk" style="flex:2">確定</button></div><p class="hint" id="eMsg"></p>`;

            el.innerHTML = hit.length ? hit.map(([x, i]) => `<div data-li="${i}" style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee8e0">${x.photo ? `<img src="${PH(x.photo, 120)}" style="width:46px;height:46px;object-fit:cover;border-radius:6px" alt="">` : '<div class="noimg" style="width:46px;height:46px;font-size:10px">沒照片</div>'}<div style="flex:1;font-size:14px">${esc(x.name)}<div style="font-size:12px;color:#7a7066">¥${x.jpy}｜$${x.price}</div></div></div>`).join("") : '<div class="hint">商品庫沒有這個</div>';
        };

        $("eLres").onclick = ev => {

            const x = LIB[+t.dataset.li];
            if (ev.target.tagName === "IMG" && x.photo) {

        renderB();
        enqueue("採買_改商品", [ p.id, JSON.stringify(o) ]);
    };
}

function editDates(l) {
    if (!l) return;
    const m = Object.assign({}, l.d || {});
    if (dSum(m) !== l.got) {
        Object.keys(m).forEach(k => delete m[k]);
        if (l.got) m[TK()] = l.got;
    }
    const rows = () => Object.keys(m).sort().map(k => `<div class="row" style="margin-bottom:6px"><input type="date" class="dd" value="${k}" style="flex:2"><input type="number" inputmode="numeric" class="dn" value="${m[k]}" style="flex:1"><span style="align-self:center">顆</span></div>`).join("");
    $("pop").dataset.soft = "";
    $("popIn").innerHTML = `<div style="font-weight:600;margin-bottom:4px">${esc(l.cust)} 的扭日期（買到 ${l.got} 顆）</div><div id="dRows">${rows()}</div><button class="small" id="dAdd">＋ 加一天</button>\n   <p class="hint">💡 每一天扭到幾顆，加起來要等於買到的 ${l.got} 顆。入單時不同天會分成不同列。</p><div class="row"><button id="dX" style="flex:1">取消</button><button class="main" id="dOk" style="flex:2">確定</button></div><p class="hint" id="dMsg"></p>`;
    $("pop").classList.add("open");
    $("dX").onclick = () => $("pop").classList.remove("open");
    $("dAdd").onclick = () => {
        const w = document.createElement("div");
        w.className = "row";
        w.style.marginBottom = "6px";
        w.innerHTML = `<input type="date" class="dd" value="${TK()}" style="flex:2"><input type="number" inputmode="numeric" class="dn" value="1" style="flex:1"><span style="align-self:center">顆</span>`;
        $("dRows").appendChild(w);
    };
    $("dOk").onclick = () => {
        const nm = {};
        let bad = false;
        [ ...document.querySelectorAll("#dRows .row") ].forEach(r => {
            const k = r.querySelector(".dd").value, n = +r.querySelector(".dn").value || 0;
            if (n <= 0) return;
            if (!/^\d{4}-\d\d-\d\d$/.test(k)) {
                bad = true;
                return;
            }
            nm[k] = (nm[k] || 0) + n;
        });
        if (bad) {
            $("dMsg").textContent = "日期沒填好";
            return;
        }
        if (dSum(nm) !== l.got) {
            $("dMsg").textContent = "加起來是 " + dSum(nm) + " 顆，要等於買到的 " + l.got + " 顆";
            return;
        }
        l.d = nm;
        $("pop").classList.remove("open");
        renderB();
        enqueue("採買_改扭日", [ l.id, JSON.stringify(nm) ]);
    };
}

$("doIn").onclick = async () => {
    if (!B) return;
    if (ops.length || running) {
        busy(true, "等資料存完…");
        await flush();
        busy(false);
    }
    const miss = B.products.filter(p => (!p.name || p.noPrice) && p.lines.some(l => l.got > 0));
    if (miss.length && !confirm("這幾檔還沒補品名或售價，這次入單會先跳過（留在清單）：\n\n" + miss.map(p => "・" + pNm(p) + (p.noPrice ? "（售價還沒填）" : "")).join("\n") + "\n\n按「確定」＝先入其他的\n按「取消」＝先回去按 ✏️ 補")) return;
    const ok = p => p.name && !p.noPrice;
    const ls = B.products.filter(ok).flatMap(p => p.lines.filter(l => l.got > 0).map(l => l.cust + "　" + p.name + " ×" + l.got));
    if (!ls.length) {
        if (miss.length) {
            alert("其他的都還沒有「買到」的數量，這次沒有東西可以入單。");
            return;
        }
        alert("還沒有「買到」的數量。用每位客人旁邊的 ＋ 記買到幾個。");
        return;
    }
    let S0 = null;
    try {
        S0 = JSON.parse(await call("採買_讀取", 1));
    } catch (e) {
        S0 = null;
    }
    if (S0) {
        const lost = [];
        B.products.forEach(p => p.lines.forEach(l => {
            if (!(l.got > 0) || !l.lpLocal) return;
            const sp = S0.products.find(x => x.id === p.id);
            const sl = sp ? sp.lines.find(x => x.id === l.id) : null;
            if (!sl || !sl.lp) lost.push(l.cust + "　" + p.name);
        }));
        if (lost.length) {
            PHOTOFAIL = lost;
            showPhotoFail();
            alert("⚠ 先不要入單：下面這幾行妳拍了照片，但照片沒存到雲端（入單會變成沒有照片）：\n\n" + lost.join("\n") + "\n\n請在那幾行再拍／選一次照片，等上面寫「✓ 都存好了」再按入單。");
            return;
        }
    }
    const gl = B.products.filter(ok).flatMap(p => p.lines.filter(l => l.got > 0).map(l => ({
        p: p,
        l: l
    })));
    const nP = new Set(gl.map(x => x.p.id)).size, nC = new Set(gl.map(x => x.l.cust)).size, nQ = gl.reduce((a, x) => a + x.l.got, 0);
    if (!confirm("要入單 " + nP + " 樣商品、" + nC + " 位客人、" + ls.length + " 筆、共 " + nQ + " 個嗎？\n\n" + ls.join("\n") + "\n\n沒買到的會留在清單")) return;
    const R = JSON.parse(await call("採買_入單"));
    B = R.state;
    knownV = B.v;
    try {
        localStorage.setItem("hokoriBraw", JSON.stringify(R.state));
    } catch (e) {}
    renderB();
    $("popIn").innerHTML = `<div style="font-size:17px;font-weight:600;color:#3b6d11">✓ 已入單：${new Set(R.done.map(x => x.name)).size} 樣商品、${new Set(R.done.map(x => x.cust)).size} 位客人、${R.ok} 筆、共 ${R.done.reduce((a, x) => a + (+x.n || 0), 0)} 個</div>${R.skip && R.skip.length ? `<div style="color:#a32d2d;font-size:14px;margin-top:6px">⚠ 還沒補品名或售價、這次沒入（留在清單）：${R.skip.map(esc).join("、")}</div>` : ""}<div style="margin:8px 0">${R.done.map(x => `<div class="logrow">${esc(x.cust)}　${esc(x.name)} ×${x.n}　$${x.price}${x.tier ? "（多抽優惠）" : ""}${x.left ? `<span style="color:#a32d2d">　還缺 ${x.left}，留在清單</span>` : ""}</div>`).join("")}</div>` + (R.dep.length ? `<div style="font-weight:600;margin-top:10px">💵 這次入單的人，該收訂金：</div>${R.dep.map(x => `<div class="logrow">${esc(x)}</div>`).join("")}<p class="hint">已經收了但還沒記的，忽略就好</p>` : "") + `<button class="main" id="popOk" style="width:100%;margin-top:12px">確定</button>`;
    $("pop").classList.add("open");
    $("popOk").onclick = () => $("pop").classList.remove("open");
};

const DB = {
    open() {
        return new Promise(r => {
            const q = indexedDB.open("hokoriWB", 1);
            q.onupgradeneeded = () => q.result.createObjectStore("kv");
            q.onsuccess = () => r(q.result);
            q.onerror = () => r(null);
        });
    },
    async set(k, v) {
        const d = await this.open();
        if (!d) return;
        d.transaction("kv", "readwrite").objectStore("kv").put(v, k);
    },
    async get(k) {
        const d = await this.open();
        if (!d) return null;
        return new Promise(r => {
            const q = d.transaction("kv").objectStore("kv").get(k);
            q.onsuccess = () => r(q.result);
            q.onerror = () => r(null);
        });
    }
};

let bT = null;

function saveBatch(now) {
    clearTimeout(bT);
    const go = () => {
        const arr = items.filter(it => it.src).map(it => ({
            src: it.src,
            name: it.name.value,
            jpy: it.jpy.value,
            ship: it.ship.value,
            rate: it.rate.value,
            fin: it.final.value,
            manual: it.manual,
            tier: it.tierBox.classList.contains("open"),
            tN: it.tN.value,
            tP: it.tP.value,
            pos: it.pos,
            st: it.st
        }));
        DB.set("batch", arr);
    };
    if (now) go(); else bT = setTimeout(go, 300);
}

document.addEventListener("input", e => {
    if (e.target.closest && e.target.closest("#list")) saveBatch();
});

document.addEventListener("click", e => {
    if (e.target.closest && (e.target.closest("#list") || e.target.closest("#ed") || e.target.closest("#sheet"))) setTimeout(saveBatch, 50);
});

(async () => {
    const arr = await DB.get("batch");
    if (!arr || !arr.length) return;
    for (const o of arr) {
        const blob = await (await fetch(o.src)).blob();
        const f = new File([ blob ], "x.jpg", {
            type: "image/jpeg"
        });
        add(f, o);
    }
})();

hint();
try {
    localStorage.removeItem("hokoriQD");
} catch (e) {}
(() => {
    let t = "";
    try {
        t = localStorage.getItem("hokoriTab") || "";
    } catch (e) {}
    if (t === "tBuy") {
        showTab("tBuy");
        openBuy();
    } else if (t === "tLook") {
        showTab("tLook");
        qload();
    }
})();
window.__ok=1;
