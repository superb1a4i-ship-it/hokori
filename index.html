        call("後台_狀態名單", st).then(r => {
            const L = JSON.parse(r);
            $("adBody").innerHTML = '<div class="adsec"><div class="hint"><b>' + esc(nm) + "</b>（" + L.length + ' 組，一組＝一位客人的一批）</div><input id="stQ" placeholder="🔍 搜尋客人名字" style="width:100%;margin:6px 0">' + L.map(x => '<div class="adr" data-stn="' + esc(x.c + " " + x.show) + '"><div class="nm"><b>' + esc(x.show) + "</b>" + (x.cr ? ' <span style="color:#c00;font-size:12px">' + esc(x.cr) + "</span>" : "") + '<div class="sm">' + esc(x.lab) + "・商品 $" + x.rev + (x.dep > 0 ? "・已收訂金 $" + x.dep : "") + (st === "待下單" ? "・要下單 $" + x.due : "") + (x.mb ? "・" + esc(x.mb) : "") + "</div></div></div>").join("") + (L.length ? "" : '<div class="hint">沒有</div>') + "</div>";
        });
        return;
    }
    if (d.adm) {
        adMode = d.adm;
        adList = [];
        adRes = {};
        adRender();
        return;
    }
    if (t.id === "adList") {
        adKey = $("adKey").value;
        $("adRows").innerHTML = '<div class="hint">讀取中…</div>';
        adRes = {};
        call("後台_名單", adMode, adKey).then(r => {
            adList = JSON.parse(r);
            adList.__k = adMode + adKey;
            adRows();
        });
        return;
    }
    if (d.adv) {
        const x = adList[+d.adv];
        x.vip = !x.vip;
        if (adMode === "定金" && x.vip) x.on = false;
        adRows();
        google.script.run.withFailureHandler(er => alert("VIP 沒存到：" + (er.message || er))).後台_VIP(x.c, x.vip);
        return;
    }
    if (t.id === "adSend") {
        const tpl = $("adTpl").value;
        adTpl[adMode] = tpl;
        const sel = adList.filter(x => x.on && x.line);
        if (!sel.length || !confirm("確定用官方賴傳給 " + sel.length + " 位嗎？\n\n範例：\n" + adPrev(sel[0]))) return;
        t.disabled = true;
        call("後台_發送", adMode, adKey, JSON.stringify(sel.map(x => ({ c: x.c, amt: x.amt }))), tpl).then(r => {
            JSON.parse(r).forEach(x => adRes[x.c] = x.r);
            adList.forEach(x => {
                if (adRes[x.c] === "已傳") x.on = false;
            });
            adRows();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.adball) {
        if (!confirm("要把這 " + ADBOK.length + " 位綁定？\n" + ADBOK.map(x => x.t + " → " + x.c).join("\n"))) return;
        t.disabled = true;
        call("後台_綁定全部", JSON.stringify(ADBOK)).then(r => {
            const o = JSON.parse(r);
            adBindRender(o.list);
            alert("綁好 " + o.ok.length + " 位" + (o.bad.length ? "\n沒綁成：\n" + o.bad.join("\n") : ""));
            google.script.run.withSuccessHandler(x => { AD = JSON.parse(x); }).後台_總覽();
        });
        return;
    }
    if (d.uplater != null) {
        const x = UP[+d.uplater];
        let v = "";
        if (!d.clear) {
            const a = prompt("客人說好哪一天付？（例：11/22）", "");
            if (!a) return;
            const m = a.match(/(\d{1,2})\D+(\d{1,2})/);
            if (!m) return alert("看不懂日期，請打像 11/22 這樣");
            const y = new Date().getFullYear();
            v = y + "-" + ("0" + m[1]).slice(-2) + "-" + ("0" + m[2]).slice(-2);
        }
        call("後台_延後付款", x.c, v, "").then(() => adUnpaid());
        return;
    }
    if (d.adok != null && d.adc2 != null) {
        call("後台_綁定確認", d.adok, d.adc2).then(r => {
            adBindRender(JSON.parse(r));
            google.script.run.withSuccessHandler(x => {
                AD = JSON.parse(x);
            }).後台_總覽();
        });
        return;
    }
    if (d.pmv) {
        PMV = d.pmv;
        return adPm();
    }
    if (d.upc) {
        UP[+d.upc].on = t.checked;
        adUnpaidRender();
        return;
    }
    if (t.id === "upSend") {
        const sel = UP.filter(x => x.on);
        if (!sel.length || !confirm("確定再提醒這 " + sel.length + " 位匯款嗎？")) return;
        t.disabled = true;
        call("後台_再提醒", JSON.stringify(sel.map(x => ({ c: x.c, k: x.k, amt: x.amt, n: x.n, first: x.first })))).then(r => {
            const m = {};
            JSON.parse(r).forEach(y => m[y.c] = y.r);
            UP.forEach(x => {
                if (m[x.c]) {
                    x.r = m[x.c];
                    x.on = false;
                    if (m[x.c] === "已傳") x.n++;
                }
            });
            adUnpaidRender();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.wsort) {
        WSort = d.wsort;
        return adWish();
    }
    if (d.wsay) {
        const v = document.querySelector('[data-wre="' + CSS.escape(d.wsay) + '"]').value.trim();
        if (!v) {
            alert("請先打留言");
            return;
        }
        call("後台_許願回", d.wsay, v).then(() => adWish());
        return;
    }
    if (d.wdraft) {
        const w = WS.find(x => x.id === d.wdraft);
        const el = document.querySelector('[data-wre="' + CSS.escape(d.wdraft) + '"]');
        if (w && w.an && el) {
            el.value = w.an.草稿 || "";
            el.focus();
        }
        return;
    }
    if (d.wdel) {
        if (!confirm("確定刪掉這個願望？")) return;
        call("後台_許願刪", d.wdel).then(() => {
            WS = WS.filter(w => w.id !== d.wdel);
            adWishRender();
        });
        return;
    }
    if (d.fqs != null) {
        const r = d.fqs, k = document.querySelector('[data-fqk="' + r + '"]').value.trim(), a = document.querySelector('[data-fqa="' + r + '"]').value.trim();
        if (!k || !a) {
            alert("關鍵字和答案都要填");
            return;
        }
        const t0 = t.textContent;
        t.disabled = true;
        t.textContent = "存檔中…";
        call("後台_常見問題存", r, k, a, true).then(x => {
            FQ = JSON.parse(x);
            pmFaqRender();
            alert("✅ 已存好：" + k.split(/[、,，\/／\s]+/)[0]);
        }).catch(e => {
            t.disabled = false;
            t.textContent = t0;
            alert("沒有存到：" + (e && e.message || e));
        });
        return;
    }
    if (d.fqd) {
        if (!confirm("刪掉這題？")) return;
        call("後台_常見問題刪", d.fqd).then(x => {
            FQ = JSON.parse(x);
            pmFaqRender();
            alert("🗑 已刪掉");
        }).catch(e => alert("沒有刪掉：" + (e && e.message || e)));
        return;
    }
    if (d.pmall) {
        const q = (s, r) => document.querySelector("[" + s + '="' + r + '"]').value.trim();
        const L = PMH.filter(x => x.st === "待核對").map(x => ({ row: x.row, c: q("data-pmc", x.row), k: q("data-pmk", x.row), amt: q("data-pma", x.row) }));
        if (!confirm("把這 " + L.length + " 筆全部入帳？（沒填客人或金額的會跳過）")) return;
        t.disabled = true;
        call("後台_匯款全部入帳", JSON.stringify(L)).then(r => {
            const o = JSON.parse(r);
            alert("✅ 入帳 " + o.ok.length + " 筆" + (o.ok.length ? "：\n" + o.ok.join("\n") : "") + (o.skip.length ? "\n\n⚠ 跳過 " + o.skip.length + " 筆：\n" + o.skip.join("\n") : ""));
            adPm();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.pmchat) {
        const u = prompt("在電腦打開官方賴跟這位客人的聊天室，把最上面的網址整段複製，貼在這裡：");
        if (!u) return;
        t.disabled = true;
        call("後台_聊天室補", d.pmchat, u.trim()).then(r => {
            PM.list.forEach(y => {
                if ((y.c || y.name || "?") === d.pmchat) y.chat = r;
            });
            delete PMC["要回"];
            adPmRender();
        }).catch(er => {
            t.disabled = false;
            alert("沒存到：" + (er.message || er));
        });
        return;
    }
    if (d.pmdone) {
        if (d.pmall2 && !confirm("確定全部都處理好了？")) return;
        t.disabled = true;
        call("後台_私訊處理", d.pmdone).then(() => {
            const done = String(d.pmdone).split(",");
            PM.list = PM.list.filter(y => done.indexOf(String(y.row)) < 0);
            if (PM.cnt) PM.cnt["要回"] = Math.max(0, (PM.cnt["要回"] || 0) - done.length);
            delete PMC["全部"];
            adPmRender();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.pmship) {
        const v = d.pmship === "1" ? $("pmShip").value : "";
        call("後台_送集運日", v).then(r => {
            PM.ship = v;
            bar("ok", "✓ 客人會看到：預計 " + r.slice(5).replace("-", "/") + " 送集運");
            if (!v) $("pmShip").value = "";
        }).catch(er => alert(er.message || er));
        return;
    }
    if (d.pmbank) {
        const v = $("pmBank").value.trim();
        if (!v) {
            alert("請先貼上匯款資訊");
            return;
        }
        t.disabled = true;
        call("後台_匯款資訊", v).then(r => {
            t.textContent = "✅ " + r;
            PM.bank = true;
            alert("✅ 匯款資訊已存好");
        }).catch(e => {
            t.disabled = false;
            alert("沒有存到：" + (e && e.message || e));
        });
        return;
    }
    if (d.pmin) {
        const q = s => document.querySelector("[" + s + '="' + d.pmin + '"]').value.trim();
        const c = q("data-pmc"), k = q("data-pmk"), a = q("data-pma");
        if (!c || !(+a > 0)) {
            alert("請確認客人和金額");
            return;
        }
        if (!confirm("把 " + c + " 的訂金 $" + a + (k ? "（" + k + " 批）" : "") + " 寫進總表？")) return;
        t.disabled = true;
        call("後台_匯款入帳", d.pmin, c, a, k).then(r => {
            t.textContent = "✅ 入帳了";
            alert(r);
            PMH = PMH.filter(y => String(y.row) !== String(d.pmin));
            if (PM.cnt) PM.cnt["匯款"] = Math.max(0, (PM.cnt["匯款"] || 1) - 1);
            adPmRender();
        }).catch(() => {
            t.disabled = false;
        });
        return;
    }
    if (d.pmnot) {
        if (!confirm("確定這則不是匯款？")) return;
        call("後台_匯款不是", d.pmnot).then(() => {
            PMH = PMH.filter(y => String(y.row) !== String(d.pmnot));
            adPmRender();
        });
        return;
    }
    if (d.pmm) {
        call("後台_私訊模式", d.pmm).then(() => adPm());
        return;
    }
    if (d.pmr) return adPm(true);
    if (d.pmok || d.pmno) {
        const row = d.pmok || d.pmno, note = document.querySelector('[data-pmn="' + row + '"]').value.trim();
        if (d.pmno && !note) {
            alert("請先在旁邊打要怎麼改");
            return;
        }
        call("後台_私訊評", row, d.pmok ? "好" : "要改", note).then(() => {
            const x = PM.list.find(y => String(y.row) === String(row));
            if (x) {
                x.ok = d.pmok ? "好" : "要改";
                x.note = note;
            }
            t.textContent = "✅ 記下了";
        });
        return;
    }
    if (d.adsave) {
        const i = +d.adsave, c = adCardsL[i], q = s => document.querySelector("[" + s + '="' + i + '"]').value.trim();
        call("後台_資料卡補充", c["客人"], q("data-adn"), q("data-adp"), q("data-adm2")).then(() => {
            c["真實姓名"] = q("data-adn");
            c["電話"] = q("data-adp");
            c["備註"] = q("data-adm2");
            t.textContent = "✅ 存好了";
        });
        return;
    }
    if (d.adnew) {
        const v = document.querySelector('[data-adin="' + CSS.escape(d.adnew) + '"]').value.trim();
        if (!v) {
            alert("請先在旁邊打這位新客人在總表要用的名字（例：賴名字（社群暱稱）");
            return;
        }
        if (!confirm("把「" + v + "」加進客人清單當新客人，並綁定這個賴？")) return;
        call("後台_綁定確認", d.adnew, v, true).then(r => adBindRender(JSON.parse(r)));
        return;
    }
    if (d.adtype) {
        const v = document.querySelector('[data-adin="' + CSS.escape(d.adtype) + '"]').value.trim();
        if (!v) return;
        call("後台_綁定確認", d.adtype, v).then(r => adBindRender(JSON.parse(r)));
    }
});

$("tabAdmin").addEventListener("change", e => {
    const d = e.target.dataset;
    if (d.wst) {
        call("後台_許願狀態", d.wst, e.target.value).then(() => {
            const w = WS.find(y => y.id === d.wst);
            if (w) w.st = e.target.value;
        });
        return;
    }
    if (d.adc) {
        adList[+d.adc].on = e.target.checked;
        adRows();
    }
    if (d.ada) {
        adList[+d.ada].amt = Math.max(0, Math.round(+e.target.value || 0));
        adRows();
    }
    if (e.target.id === "adKey") {
        adKey = e.target.value;
        adList = [];
        $("adRows").innerHTML = "";
    }
});

$("tabAdmin").addEventListener("input", e => {
    if (e.target.id === "adQ") {
        adQ = e.target.value;
        if ($("adRows") && adList.length) adRows();
        return;
    }
    if (e.target.id === "bdQ") {
        const q = e.target.value.trim().toLowerCase();
        document.querySelectorAll("[data-bdn]").forEach(el => el.style.display = !q || el.dataset.bdn.indexOf(q) >= 0 ? "" : "none");
        return;
    }
    if (e.target.id === "stQ") {
        const q = e.target.value.trim().toLowerCase();
        document.querySelectorAll("[data-stn]").forEach(el => el.style.display = !q || el.dataset.stn.toLowerCase().indexOf(q) >= 0 ? "" : "none");
        return;
    }
    if (e.target.id === "adTpl") {
        adTpl[adMode] = e.target.value;
        const sel = adList.filter(x => x.on && x.line);
        const pv = document.querySelector(".adpv");
        if (pv && sel[0]) pv.textContent = adPrev(sel[0]);
    }
});

$("kjRef").onclick = () => kjLoad(true);

$("kjFoot").addEventListener("click", e => {
    const b = e.target.closest("[data-kpz]");
    if (b) kjPrize(b.dataset.kset, b.dataset.kpz);
});

hint();

})();
